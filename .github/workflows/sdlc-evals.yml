name: SDLC evals

# The agent's configuration steers every stage, so it gets regression tests:
# any change to CLAUDE.md, AGENTS.md, REVIEW.md, .claude/** or evals/** runs
# the eval suite. A case that stops passing blocks the change until someone
# decides the case or the configuration is wrong.

on:
  pull_request:
    paths: ['CLAUDE.md', 'AGENTS.md', 'REVIEW.md', '.claude/**', 'evals/**', 'scripts/sdlc/**', 'scripts/verify*.mjs']
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    name: Harness evals
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Deterministic harness tests (no model)
        run: npm run sdlc:test
      - name: Key present
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if node scripts/sdlc/agent.mjs --check; then echo "has_key=true" >> "$GITHUB_OUTPUT"; else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No model credential for the configured provider; model-backed eval cases skipped, deterministic tests ran."
            echo "**Model-backed evals skipped: no model credential is set.** Deterministic harness tests ran." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install the configured provider CLI (sdlc/config.json agent.provider)
        if: steps.key.outputs.has_key == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/sdlc/agent.mjs --install
      - name: Model-backed eval cases
        if: steps.key.outputs.has_key == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # pipefail: the eval verdict is node's exit code, not tee's.
          set -o pipefail
          node evals/run.mjs | tee -a "$GITHUB_STEP_SUMMARY"
