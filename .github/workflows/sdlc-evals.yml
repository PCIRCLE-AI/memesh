name: SDLC evals

# The agent's configuration steers every stage, so it gets regression tests:
# any change to CLAUDE.md, AGENTS.md, REVIEW.md, .claude/** or evals/** runs
# the eval suite. A case that stops passing blocks the change until someone
# decides the case or the configuration is wrong.

on:
  pull_request:
    paths: ['CLAUDE.md', 'AGENTS.md', 'REVIEW.md', '.claude/**', 'evals/**', 'scripts/sdlc/**', 'scripts/verify*.mjs']
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    name: Harness evals
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Deterministic harness tests (no model)
        run: npm run sdlc:test
      - name: Key present
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "has_key=true" >> "$GITHUB_OUTPUT"; else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No model credential (ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN); model-backed eval cases skipped, deterministic tests ran."
            echo "**Model-backed evals skipped: no model credential is set.** Deterministic harness tests ran." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Claude Code (pinned)
        if: steps.key.outputs.has_key == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.270
      - name: Model-backed eval cases
        if: steps.key.outputs.has_key == 'true'
        run: node evals/run.mjs | tee -a "$GITHUB_STEP_SUMMARY"
