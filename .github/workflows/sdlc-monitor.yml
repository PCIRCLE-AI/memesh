name: SDLC monitor

# Stage 6. A deterministic script compares the public origin and the CI
# history with `bands` in sdlc/config.json. Tier log: recorded here. Tier
# diagnose or propose: a tracking issue is filed (always), and with the
# secrets set Claude reads (never writes product code) and files an intent PR,
# once per open breach, so the loop restarts itself.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sdlc-monitor
  cancel-in-progress: false

jobs:
  detect:
    name: Detect (deterministic)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tier: ${{ steps.eval.outputs.tier }}
      metric: ${{ steps.eval.outputs.metric }}
      slug: ${{ steps.eval.outputs.slug }}
      open_issue: ${{ steps.dedupe.outputs.open_issue }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: eval
        run: |
          mkdir -p .sdlc-run
          node scripts/sdlc/monitor.mjs --json > .sdlc-run/breach.json
          { echo '```'; node scripts/sdlc/monitor.mjs; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          tier="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".sdlc-run/breach.json","utf8")).tier)')"
          metric="$(node -e 'const r=JSON.parse(require("fs").readFileSync(".sdlc-run/breach.json","utf8"));const o=["ok","log","diagnose","propose"];const b=[...r.breaches].sort((a,c)=>o.indexOf(c.tier)-o.indexOf(a.tier))[0];console.log(b?b.metric:"")')"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "metric=$metric" >> "$GITHUB_OUTPUT"
          echo "slug=$(date -u +%Y-%m-%d)-monitor-${metric:-none}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-${{ github.run_id }}
          path: .sdlc-run/breach.json
      - id: dedupe
        if: steps.eval.outputs.tier == 'diagnose' || steps.eval.outputs.tier == 'propose'
        env:
          METRIC: ${{ steps.eval.outputs.metric }}
        run: |
          n="$(gh issue list --label sdlc:breach --state open --search "$METRIC in:title" --json number --jq 'length')"
          echo "open_issue=$n" >> "$GITHUB_OUTPUT"
          [ "$n" = "0" ] || echo "Breach $METRIC already tracked by an open sdlc:breach issue; not filing again." >> "$GITHUB_STEP_SUMMARY"

  respond:
    name: File the breach, diagnose, open an intent
    needs: detect
    if: (needs.detect.outputs.tier == 'diagnose' || needs.detect.outputs.tier == 'propose') && needs.detect.outputs.open_issue == '0'
    permissions:
      contents: read
      issues: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.SDLC_GITHUB_TOKEN || github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      METRIC: ${{ needs.detect.outputs.metric }}
      TIER: ${{ needs.detect.outputs.tier }}
      SLUG: ${{ needs.detect.outputs.slug }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SDLC_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: monitor-${{ github.run_id }}
          path: .sdlc-run
      - name: Tracking issue (always, so a breach is never silent)
        run: |
          gh issue create --label sdlc:breach --title "Control band breached: $METRIC ($TIER)" --body "$(printf 'Detected by scripts/sdlc/monitor.mjs on run %s.\n\n```json\n%s\n```\n\nThe loop files an intent PR from this issue when a model credential (ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN) and SDLC_GITHUB_TOKEN are set; otherwise a person writes intent/%s.md.' "$RUN_URL" "$(cat .sdlc-run/breach.json)" "$SLUG")"
      - name: Secrets present for the diagnosis
        id: secrets
        env:
          PAT: ${{ secrets.SDLC_GITHUB_TOKEN }}
        run: |
          if { [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; } && [ -n "$PAT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No model credential (ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN) or no SDLC_GITHUB_TOKEN; breach recorded as an issue only, no intent PR."
            echo "Diagnosis skipped: a required secret is missing. The breach is on the issue." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Claude Code (pinned)
        if: steps.secrets.outputs.ok == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.270
      - name: Read-only diagnosis into an intent PR
        if: steps.secrets.outputs.ok == 'true'
        run: node scripts/sdlc/run-stage.mjs --stage diagnose --slug "$SLUG" --metric "$METRIC" --breach .sdlc-run/breach.json
