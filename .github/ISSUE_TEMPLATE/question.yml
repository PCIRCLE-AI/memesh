name: Question
description: Ask a question about MeMesh
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question about MeMesh? We're happy to help!

        Before asking, please check:
        - [README.md](https://github.com/PCIRCLE-AI/memesh/blob/main/README.md)
        - [API and CLI reference](https://github.com/PCIRCLE-AI/memesh/blob/main/docs/api/API_REFERENCE.md)
        - [Platform guides](https://github.com/PCIRCLE-AI/memesh/blob/main/docs/platforms/README.md)
        - [Existing issues](https://github.com/PCIRCLE-AI/memesh/issues)

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      description: What is your question about?
      options:
        - Installation/Setup
        - MCP Configuration
        - MCP tool usage
        - Memory System
        - Troubleshooting
        - Best Practices
        - Other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: Ask your question in detail
      placeholder: |
        I'm trying to...
        How do I...?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Any relevant context
      placeholder: |
        My setup: ...
        I've already tried: ...

  - type: textarea
    id: config
    attributes:
      label: Relevant Configuration
      description: Any relevant configuration (if applicable)
      render: json
