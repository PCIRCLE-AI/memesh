name: Bug Report
description: Report a bug in MeMesh
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug!
        Please fill out the form below to help us investigate.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - CLI
        - MCP server/tools
        - Dashboard
        - Hooks/plugin
        - Memory/knowledge graph
        - Agent messaging
        - Work packages/proposal review
        - Installation/setup
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? What did you expect to happen?
      placeholder: |
        When I tried to...
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Configure MeMesh with...
        2. Call the tool...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: Error Output
      description: Any error messages or logs
      render: shell
      placeholder: |
        Paste error messages or logs here

  - type: input
    id: version
    attributes:
      label: MeMesh Version
      description: Run `memesh --version`
      placeholder: "Output of memesh --version"
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: Client or host
      description: Which client or host are you using?
      options:
        - Claude Code CLI
        - Codex CLI
        - Claude Desktop
        - Cursor
        - VS Code
        - Other MCP client
        - Other
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Run `node --version`
      placeholder: "v22.13.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: textarea
    id: mcp-config
    attributes:
      label: MCP Configuration
      description: Your MCP configuration (remove sensitive info)
      render: json
      placeholder: |
        {
          "mcpServers": {
            "memesh": {
              "command": "memesh-mcp"
            }
          }
        }

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any additional information that might help
