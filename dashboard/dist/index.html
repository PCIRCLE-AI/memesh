adme-parity.unreadable.summary":"Could not read README.md: {detail}","doctor.msg.readme-parity.drift.summary":"Some translated READMEs drifted from the English one: {detail}","doctor.msg.readme-parity.drift.fix":"Re-sync the listed READMEs with README.md.","doctor.msg.config.invalid-json.summary":"The config file at {path} is not valid JSON, so it is being ignored.","doctor.msg.config.invalid-json.fix":"Fix or delete {path}, then run `memesh config list` to confirm it loads.","doctor.msg.mcp-config.missing.summary":"The file that connects memesh to Claude Code (.claude-plugin/mcp.json) is missing.","doctor.msg.mcp-config.missing.fix":"Reinstall MeMesh to restore it.","doctor.msg.mcp-config.invalid-json.summary":".claude-plugin/mcp.json is damaged (not valid JSON), so Claude Code cannot read it.","doctor.msg.mcp-config.invalid-json.fix":"Fix {path} or reinstall MeMesh.","doctor.msg.mcp-config.no-entry.summary":".claude-plugin/mcp.json no longer contains the memesh server entry.","doctor.msg.mcp-config.no-entry.fix":"Reinstall MeMesh to restore it.","doctor.msg.mcp-config.entry-missing.summary":"`.claude-plugin/mcp.json` starts a file that is not in this install, so every memesh tool inside Claude Code fails to start.","doctor.msg.mcp-config.entry-missing.fix":"Reinstall MeMesh. If you edited `.claude-plugin/mcp.json` by hand, point it back at `${CLAUDE_PLUGIN_ROOT}/dist/mcp/server.js`.","doctor.msg.mcp-config.placeholder-unresolved.summary":"NOT VERIFIED: `.claude-plugin/mcp.json` starts a path containing `${CLAUDE_PLUGIN_ROOT}`, which only the Claude Code plugin runtime fills in. This copy is not running as a plugin, so the file it names was not checked.","doctor.msg.mcp-config.placeholder-unresolved.fix":"Check it the way the plugin runtime would: run `CLAUDE_PLUGIN_ROOT=<this install's folder> memesh doctor`.","doctor.msg.hooks-config.missing.summary":"hooks/hooks.json is missing, so automatic memory capture cannot run.","doctor.msg.hooks-config.missing.fix":"Reinstall MeMesh to restore it.","doctor.msg.hooks-config.invalid-json.summary":"hooks/hooks.json is damaged (not valid JSON).","doctor.msg.hooks-config.invalid-json.fix":"Fix {path} or reinstall MeMesh.","doctor.msg.hooks-config.missing-types.summary":"hooks/hooks.json is missing these hook types: {types}. Some automatic capture will not run.","doctor.msg.hooks-config.missing-types.fix":"Restore the shipped hook configuration or reinstall MeMesh.","doctor.msg.hook-scripts.none.summary":"The hook configuration contains no scripts, so nothing can be captured automatically.","doctor.msg.hook-scripts.none.fix":"Reinstall MeMesh.","doctor.msg.hook-scripts.missing.summary":"These hook scripts are missing: {files}","doctor.msg.hook-scripts.missing.fix":"Reinstall MeMesh to restore them.","doctor.msg.hook-scripts.not-executable.summary":"These hook scripts exist but are not allowed to run: {files}","doctor.msg.hook-scripts.not-executable.fix":"Run `chmod +x scripts/hooks/*.js`, or `npm run build` in a source checkout.","doctor.msg.hook-wiring.no-marker.summary":"memesh is not connected to Claude Code yet, so nothing gets remembered automatically.","doctor.msg.hook-wiring.no-marker.fix":"Run `memesh install-hooks` once, then `memesh doctor` to confirm.","doctor.msg.hook-wiring.script-missing.summary":"A wired memesh hook points at {path}, which no longer exists — the agent invokes a missing file on every matching event. Usually residue from an upgrade that retired the hook.","doctor.msg.hook-wiring.script-missing.fix":"Run `memesh install-hooks` to re-wire (it removes retired entries), then restart your agent.","doctor.msg.hook-wiring.marker-unreadable.summary":"The connection record at {path} cannot be read.","doctor.msg.hook-wiring.marker-unreadable.fix":"Run `memesh install-hooks` again.","doctor.msg.hook-wiring.marker-malformed.summary":"The connection record is damaged.","doctor.msg.hook-wiring.marker-malformed.fix":"Run `memesh install-hooks` again.","doctor.msg.hook-wiring.settings-missing.summary":"The Claude Code settings file ({path}) is gone, so the connection is broken.","doctor.msg.hook-wiring.settings-missing.fix":"Run `memesh install-hooks` again.","doctor.msg.hook-wiring.settings-invalid.summary":"{path} is damaged (not valid JSON).","doctor.msg.hook-wiring.settings-invalid.fix":"Restore it from a backup, or run `memesh install-hooks` to recreate it.","doctor.msg.hook-wiring.entries-removed.summary":"The memesh entries were removed from {path}, so the connection is broken.","doctor.msg.hook-wiring.entries-removed.fix":"Run `memesh install-hooks` again.","doctor.msg.hook-wiring.root-moved.summary":"The connection points at {path}, which no longer exists (memesh probably moved).","doctor.msg.hook-wiring.root-moved.fix":"Run `memesh install-hooks` to refresh it.","doctor.msg.hook-activity.never-ran.summary":"No capture hook has run in the {hours} hours since tracking began, even though hook wiring is in place — nothing is being remembered.","doctor.msg.hook-activity.never-ran.fix":"Finish one work session, then run `memesh doctor` again. If it still says no hook has run, run `memesh install-hooks` and restart your agent.","doctor.msg.hook-activity.stale.summary":"The last capture hook ran about {hours} hours ago ({hook}). If you have worked since then, capture has stopped and nothing from those sessions was saved.","doctor.msg.hook-activity.stale.fix":"Restart your agent, end one session, then run `memesh doctor` again. If it does not recover, run `memesh install-hooks`.","doctor.msg.hook-activity.stale-unconfirmed.summary":"The session-summary hook last ran about {hours} hours ago, and no Claude Code writes landed in the last 3 days either. If this machine has moved to another agent (Codex / Gemini), this is expected; if you still use Claude Code here, capture has stopped.","doctor.msg.hook-activity.stale-unconfirmed.fix":"If you still use Claude Code on this machine: restart it, end one session, and re-run `memesh doctor`. If it does not recover, run `memesh install-hooks`.","doctor.msg.hook-activity.query-failed.summary":"Could not read hook activity from the database: {detail}. Capture health is unknown, which is not the same as healthy.","doctor.msg.hook-activity.query-failed.fix":"Run `memesh doctor --verbose` for the full error, and check that ~/.memesh is readable and not out of disk.","doctor.msg.hook-activity.stale-unknown.summary":"The {hook} hook's last-run timestamp cannot be read (corrupt, or stamped by a machine with a wrong clock). Capture health is unknown, which is not the same as healthy.","doctor.msg.hook-activity.stale-unknown.fix":"End one work session, then run `memesh doctor` again — a fresh run overwrites the bad timestamp.","doctor.msg.hook-activity.disabled.summary":"Automatic capture is turned off (MEMESH_AUTO_CAPTURE or config autoCapture) — deliberately, so hook silence is expected. Re-enable it to resume capturing sessions.","doctor.msg.hook-activity.disabled-env.summary":"Automatic capture is turned off by MEMESH_AUTO_CAPTURE=false in this shell's environment. Doctor can only see its own environment — if your agent runs without this variable, capture there is unaffected.","doctor.msg.hook-activity.not-wired.summary":"No capture hook has ever run — and no capture hook (Stop / PostToolUse / PreCompact) is confirmed wired on this machine, so there is nothing to run.","doctor.msg.hook-activity.not-wired.fix":"If you want automatic capture, run `memesh install-hooks`. If this install is MCP-only (Codex / Gemini), this is expected and safe to ignore.","doctor.msg.hook-activity.stop-silent.summary":"The {hook} hook is stamping, but the session-summary hook has never run once in the {hours} hours since tracking began — session capture may be broken while commit capture hides it.","doctor.msg.hook-activity.stop-silent.fix":"End one work session and run `memesh doctor` again. If session-summary still has not run, run `memesh install-hooks` and restart your agent.","doctor.label.capture-liveness":"Capture liveness","doctor.msg.capture-liveness.silent-hook.summary":"{hook}: {runs} runs, 0 writes — '{reason}'. The hook is alive and deciding there is nothing to save every single time, which is also what a broken capture path looks like.","doctor.msg.capture-liveness.silent-hook.fix":"Run `memesh doctor --json` for the per-hook figures. If the reason does not describe your usage, run `memesh install-hooks` and restart your agent.","doctor.msg.capture-liveness.type-stopped.summary":"Nothing of type '{type}' was captured in the last 7 days, against {prev} in the 7 days before. Something that was being remembered has stopped being remembered.","doctor.msg.capture-liveness.type-stopped.fix":"Run `memesh doctor --json` for the per-hook figures, and check whether the way you work changed — if it did not, run `memesh install-hooks` and restart your agent.","doctor.msg.capture-liveness.never-ran.summary":"The {hook} hook has left no record and no heartbeat in the {hours} hours since tracking began — it has never run, so nothing it would capture is being saved.","doctor.msg.capture-liveness.never-ran.fix":"Run `memesh install-hooks` and restart your agent, then end one work session and re-run `memesh doctor`.","doctor.msg.capture-liveness.not-wired.summary":"The {hook} hook has never run, but no capture hook is wired on this machine.","doctor.msg.capture-liveness.not-wired.fix":"If you want automatic capture, run `memesh install-hooks`. If this is MCP-only (Codex, Gemini, or Cursor), this is expected.","doctor.msg.capture-liveness.never-ran-legacy.summary":"The {hook} hook has no outcome record, but {captured} auto-capture memories landed since tracking began. Older hooks are probably still running.","doctor.msg.capture-liveness.never-ran-legacy.fix":"Update the MeMesh hooks, then restart your agent and run `memesh doctor` again.","doctor.msg.capture-liveness.query-failed.summary":"Could not read capture liveness from the database: {detail}. Whether anything is being saved is unknown, which is not the same as healthy.","doctor.msg.capture-liveness.query-failed.fix":"The error is quoted above. Check that ~/.memesh is readable and that the disk is not full.","doctor.msg.hook-activity.never-ran-legacy.summary":"No hook has stamped the heartbeat, but {captured} auto-capture memories landed since tracking began — hooks from a version before heartbeat tracking are probably still running.","doctor.msg.hook-activity.never-ran-legacy.fix":"Update the memesh hooks to the current version (plugin installs: `/plugin update memesh`; npm installs: `memesh install-hooks`), then restart your agent.","doctor.msg.node-runtime.too-old.summary":"Your Node.js is older than this package supports. {detail}","doctor.msg.node-runtime.too-old.fix":"Upgrade Node.js to {required} or newer, then run `memesh doctor` again.","doctor.msg.native-binding.load-failed.summary":"SQLite could not open a database: {detail}.","doctor.msg.native-binding.load-failed.fix":"Check the Node runtime and reinstall MeMesh if necessary.","doctor.msg.shell-cli.not-on-path.summary":"The `memesh` command is not available in your terminal. Claude Code features still work — this only affects typing `memesh` yourself.","doctor.msg.shell-cli.not-on-path.fix":"Run `npm install -g @pcircle/memesh` if you want a separate terminal command. Its database depends on its configuration.","doctor.msg.shell-cli.versions.summary":"Installed versions: this interface {current}; terminal {terminal}.","doctor.msg.plugin-cache.stale.summary":"The plugin was installed from commit {installed}, but the marketplace has moved to {marketplace} under the same version. {host} does not refresh a cache whose version did not change, so you are running older code than the marketplace has.","doctor.msg.plugin-cache.stale.fix":"Run `{command}` to refresh the cache, then restart {host}.","doctor.msg.plugin-cache.unverifiable.summary":"Could not tell whether the installed plugin matches the marketplace. The version alone cannot answer this — two builds can carry the same version.","doctor.msg.plugin-cache.unverifiable.fix":"Run `{command}` once; it records the commit, after which this check can answer.","doctor.msg.dashboard.missing.summary":"The dashboard files are missing.","doctor.msg.dashboard.missing.fix":"Build them with `cd dashboard && npm install && npm run build`.","doctor.msg.update-status.no-cache.summary":"memesh has not been able to check for newer versions yet.","doctor.msg.update-status.no-cache.fix":"Run `memesh status` once while online — that stores the answer and this notice goes away.","doctor.msg.update-status.deprecated.summary":"Version {version} has been withdrawn by its maintainers: {detail}","doctor.msg.update-status.deprecated.fix":"Update now — run `memesh update` (or follow your install method).","doctor.msg.update-status.deprecation-unknown.summary":"Could not confirm whether version {version} is still safe to use: {detail}","doctor.msg.update-status.deprecation-unknown.fix":"Run `memesh status` while online to retry.","doctor.msg.update-status.update-available.summary":"A newer version is available: {latest} (you have {current}).","doctor.msg.update-status.update-available.fix":"Run `memesh update` to upgrade.","doctor.msg.update-status.stale.summary":"Version {version} is current, but the update info is old.","doctor.msg.update-status.stale.fix":"Run `memesh status` while online to refresh it.","doctor.msg.http-probe.bad-status.summary":"The local server at {url} answered with an error (HTTP {status}).","doctor.msg.http-probe.bad-status.fix":"Restart it with `memesh serve` and check the logs.","doctor.msg.http-probe.no-server.summary":"No local server is running at {url}.","doctor.msg.http-probe.no-server.fix":"Start one with `memesh serve` if you want the dashboard.","doctor.msg.skills-manifest.missing-dev.summary":"No file-integrity manifest found (normal when running from source code).","doctor.msg.skills-manifest. ring.settings-invalid.fix":"從備份還原，或用 `memesh install-hooks` 重建。","doctor.msg.hook-wiring.entries-removed.summary":"{path} 裡的 memesh 設定被移除了，連接已中斷。","doctor.msg.hook-wiring.entries-removed.fix":"再執行一次 `memesh install-hooks`。","doctor.msg.hook-wiring.root-moved.summary":"連接指向的 {path} 已經不存在（memesh 可能被搬走了）。","doctor.msg.hook-wiring.root-moved.fix":"執行 `memesh install-hooks` 更新路徑。","doctor.msg.hook-activity.never-ran.summary":"從開始追蹤到現在 {hours} 小時，沒有任何擷取 hook 跑過——而 hook 接線是好的，代表它們該跑卻沒跑，沒有任何東西被記下來。","doctor.msg.hook-activity.never-ran.fix":"完整用一次工作階段，再跑 `memesh doctor`。如果還是說沒有 hook 跑過，執行 `memesh install-hooks` 然後重啟 agent。","doctor.msg.hook-activity.stale.summary":"最後一次擷取 hook 是大約 {hours} 小時前跑的（{hook}）。如果你這段時間有在工作，代表擷取已經停了，那些工作階段的內容都沒被存下來。","doctor.msg.hook-activity.stale.fix":"重啟 agent，結束一次工作階段，再跑 `memesh doctor`。如果沒恢復，執行 `memesh install-hooks`。","doctor.msg.hook-activity.stale-unconfirmed.summary":"session-summary hook 上次執行大約在 {hours} 小時前，而且過去 3 天也沒有任何 Claude Code 的寫入。如果這台機器已改用其他 agent（Codex / Gemini），這是正常的；如果你在這裡仍使用 Claude Code，擷取已經停了。","doctor.msg.hook-activity.stale-unconfirmed.fix":"如果這台機器仍在使用 Claude Code：重啟它、結束一個 session，再執行一次 `memesh doctor`。若仍未恢復，執行 `memesh install-hooks`。","doctor.msg.hook-activity.query-failed.summary":"讀不到 hook 活動紀錄：{detail}。擷取狀態現在是「不知道」，那跟「正常」不是同一件事。","doctor.msg.hook-activity.query-failed.fix":"用 `memesh doctor --verbose` 看完整錯誤，並確認 ~/.memesh 讀得到、磁碟沒滿。","doctor.msg.hook-activity.stale-unknown.summary":"{hook} hook 的最後執行時間讀不出來（資料壞了，或是被時鐘不準的機器蓋的章）。擷取狀態現在是「不知道」，那跟「正常」不是同一件事。","doctor.msg.hook-activity.stale-unknown.fix":"結束一次工作階段後再跑 `memesh doctor`——新的一次執行會把壞掉的時間蓋掉。","doctor.msg.hook-activity.disabled.summary":"自動擷取已關閉（MEMESH_AUTO_CAPTURE 或設定檔的 autoCapture）——這是刻意設定，hook 沒動靜是預期中的。想恢復擷取就把它打開。","doctor.msg.hook-activity.disabled-env.summary":"自動擷取被這個 shell 環境中的 MEMESH_AUTO_CAPTURE=false 關閉了。doctor 只能看到自己所在的環境——如果你的 agent 執行時沒有這個變數，那邊的擷取不受影響。","doctor.msg.hook-activity.not-wired.summary":"從來沒有任何擷取 hook 執行過——而且這台機器上沒有確認接好任何擷取 hook（Stop / PostToolUse / P s-config.missing.summary":"hooks/hooks.json 不见了，自动记忆功能无法运行。","doctor.msg.hooks-config.missing.fix":"重新安装 MeMesh 即可恢复。","doctor.msg.hooks-config.invalid-json.summary":"hooks/hooks.json 已损坏（不是有效的 JSON）。","doctor.msg.hooks-config.invalid-json.fix":"修好 {path}，或重新安装 MeMesh。","doctor.msg.hooks-config.missing-types.summary":"hooks/hooks.json 少了这些 hook 类型：{types}。部分自动记录不会运行。","doctor.msg.hooks-config.missing-types.fix":"恢复出厂的 hook 配置，或重新安装 MeMesh。","doctor.msg.hook-scripts.none.summary":"Hook 配置里没有任何脚本，什么都不会被自动记录。","doctor.msg.hook-scripts.none.fix":"重新安装 MeMesh。","doctor.msg.hook-scripts.missing.summary":"这些 hook 脚本不见了：{files}","doctor.msg.hook-scripts.missing.fix":"重新安装 MeMesh 即可恢复。","doctor.msg.hook-scripts.not-executable.summary":"这些 hook 脚本存在但没有执行权限：{files}","doctor.msg.hook-scripts.not-executable.fix":"运行 `chmod +x scripts/hooks/*.js`；源码安装则跑 `npm run build`。","doctor.msg.hook-wiring.no-marker.summary":"memesh 还没接入 Claude Code，所以不会自动记住任何东西。","doctor.msg.hook-wiring.no-marker.fix":"运行一次 `memesh install-hooks` 完成连接，再用 `memesh doctor` 确认。","doctor.msg.hook-wiring.script-missing.summary":"已接线的 memesh hook 指向 {path}，但这个文件已不存在——agent 每次触发对应事件都会调用一个不存在的文件。通常是升级移除某个 hook 后留下的残留。","doctor.msg.hook-wiring.script-missing.fix":"运行 `memesh install-hooks` 重新接线（它会移除已退役的条目），然后重启你的 agent。","doctor.msg.hook-wiring.marker-unreadable.summary":"{path} 的连接记录读不到。","doctor.msg.hook-wiring.marker-unreadable.fix":"再运行一次 `memesh install-hooks`。","doctor.msg.hook-wiring.marker-malformed.summary":"连接记录已损坏。","doctor.msg.hook-wiring.marker-malformed.fix":"再运行一次 `memesh install-hooks`。","doctor.msg.hook-wiring.settings-missing.summary":"Claude Code 的设置文件（{path}）不见了，连接已中断。","doctor.msg.hook-wiring.settings-missing.fix":"再运行一次 `memesh install-hooks`。","doctor.msg.hook-wiring.settings-invalid.summary":"{path} 已损坏（不是有效的 JSON）。","doctor.msg.hook-wiring.settings-invalid.fix":"从备份恢复，或用 `memesh install-hooks` 重建。","doctor.msg.hook-wiring.entries-removed.summary":"{path} 里的 memesh 配置被移除了，连接已中断。","doctor.msg.hook-wiring.entries-removed.fix":"再运行一次 `memesh install-hooks`。","doctor.msg.hook-wiring.root-moved.summary":"连接指向的 {path} 已不存在（memesh 可能被移动了）。","doctor.msg.hook-wiring.root-moved.fix":"运行 `memesh install-hooks` 更新路径。","doctor.msg.hook-activity.never-ran.summary":"从开始追踪到现在 {hours} 小时，没有任何抓取 hook 跑过——而 hook 接线是好的，代表它们该跑却没跑，没有任何东西被记下来。","doctor.msg.hook-activity.never-ran.fix":"完整用一次工作会话，再跑 `memesh doctor`。如果还是说没有 hook 跑过，执行 `memesh install-hooks` 然后重启 agent。","doctor.msg.hook-activity.stale.summary":"最后一次抓取 hook 是大约 {hours} 小时前跑的（{hook}）。如果你这段时间有在工作，代表抓取已经停了，那些会话的内容都没被存下来。","doctor.msg.hook-activity.stale.fix":"重启 agent，结束一次工作会话，再跑 `memesh doctor`。如果没恢复，执行 `memesh install-hooks`。","doctor.msg.hook-activity.stale-unconfirmed.summary":"session-summary hook 上次运行大约在 {hours} 小时前，而且过去 3 天也没有任何 Claude Code 的写入。如果这台机器已改用其他 agent（Codex / Gemini），这是正常的；如果你在这里仍使用 Claude Code，捕获已经停了。","doctor.msg.hook-activity.stale-unconfirmed.fix":"如果这台机器仍在使用 Claude Code：重启它、结束一个 session，再运行一次 `memesh doctor`。若仍未恢复，运行 `memesh install-hooks`。","doctor.msg.hook-activity.query-failed.summary":"读不到 hook 活动记录：{detail}。抓取状态现在是「不知道」，那跟「正常」不是同一件事。","doctor.msg.hook-activity.query-failed.fix":"用 `memesh doctor --verbose` 看完整错误，并确认 ~/.memesh 读得到、磁盘没满。","doctor.msg.hook-activity.stale-unknown.summary":"{hook} hook 的最后执行时间读不出来（数据坏了，或是被时钟不准的机器盖的章）。抓取状态现在是「不知道」，那跟「正常」不是同一件事。","doctor.msg.hook-activity.stale-unknown.fix":"结束一次工作会话后再跑 `memesh doctor`——新的一次执行会把坏掉的时间盖掉。","doctor.msg.hook-activity.disabled.summary":"自动抓取已关闭（MEMESH_AUTO_CAPTURE 或配置文件的 autoCapture）——这是刻意设置，hook 没动静是预期中的。想恢复抓取就把它打开。","doctor.msg.hook-activity.disabled-env.summary":"自动捕获被这个 shell 环境中的 MEMESH_AUTO_CAPTURE=false 关闭了。doctor 只能看到自己所在的环境——如果你的 agent 运行时没有这个变量，那边的捕获不受影响。","doctor.msg.hook-activity.not-wired.summary":"从来没有任何捕获 hook 运行过——而且这台机器上没有确认接好任何捕获 hook（Stop / PostToolUse / PreCompact），所以本来就没有东西可以运行。","doctor.msg.hook-activity.not-wired.fix":"想要自动抓取就执行 `memesh install-hooks`。如果这个安装只走 MCP（Codex / Gemini），这是正常状态，可以放心忽略。","doctor.msg.hook-activity.stop-silent.summary":"{hook} hook 有在盖章，但从开始追踪到现在 {hours} 小时，session-summary hook 一次都没跑过——session 抓取可能坏了，只是被 commit 抓取盖住看不见。","doctor.msg.hook-activity.stop-silent.fix":"完整结束一次工作会话再跑 `memesh doctor`。如果 session-summary 还是没跑过，执行 `memesh install-hooks` 然后重启 agent。","doctor.label.capture-liveness":"记录是否还在写","doctor.msg.capture-liveness.silent-hook.summary":"{hook}：跑了 {runs} 次，一次都没写入 —— 原因是“{reason}”。这个 hook 还活着，但每一次都判断没东西可存；捕捉管线坏掉时看起来也是这样。","doctor.msg.capture-liveness.silent-hook.fix":"跑 `memesh doctor --json` 看每个 hook 的数字。如果那个原因跟你的用法对不上，执行 `memesh install-hooks` 然后重启 agent。","doctor.msg.capture-liveness.type-stopped.summary":"最近 7 天没有存下任何“{type}”，而前 7 天有 {prev} 条。本来会被记住的东西，现在不再被记住了。","doctor.msg.capture-liveness.type-stopped.fix":"跑 `memesh doctor --json` 看每个 hook 的数字，并确认你的工作方式有没有改变；如果没有，执行 `memesh install-hooks` 然后重启 agent。","doctor.msg.capture-liveness.never-ran.summary":"从开始追踪到现在的 {hours} 小时里，{hook} hook 既没有留下记录也没有心跳 —— 它从来没跑过，所以它该捕捉的东西全都没有存下来。","doctor.msg.capture-liveness.never-ran.fix":"执行 `memesh install-hooks` 并重启 agent，然后完整结束一次工作会话，再跑一次 `memesh doctor`。","doctor.msg.capture-liveness.not-wired.summary":"{hook} hook 从未运行，但这台机器没有接入任何捕捉 hook。","doctor.msg.capture-liveness.not-wired.fix":"如果你要自动捕捉，请执行 `memesh install-hooks`。如果这是纯 MCP（Codex、Gemini 或 Cursor），这是正常的。","doctor.msg.capture-liveness.never-ran-legacy.summary":"{hook} hook 没有结果记录，但追踪开始后已有 {captured} 条自动捕捉记忆落地。可能仍在运行旧版 hook。","doctor.msg.capture-liveness.never-ran-legacy.fix":"更新 MeMesh hooks，重启 agent，然后再次执行 `memesh doctor`。","doctor.msg.capture-liveness.query-failed.summary":"无法从数据库读取捕捉状态：{detail}。现在不知道有没有东西被存下来，而“不知道”不等于“正常”。","doctor.msg.capture-liveness.query-failed.fix":"错误信息如上。请确认 ~/.memesh 可以读取，而且磁盘没有满。","doctor.msg.hook-activity.never-ran-legacy.summary":"没有任何 hook 盖过心跳章，但追踪开始以来已存入 {captured} 条自动捕获的记忆——很可能是心跳追踪之前版本的 hook 还在运行。","doctor.msg.hook-activity.never-ran-legacy.fix":"把 memesh hooks 更新到当前版本（plugin 安装：`/plugin update memesh`；npm 安装：`memesh install-hooks`），然后重启 agent。","doctor.msg.node-runtime.too-old.summary":"你的 Node.js 版本比这个包支持的还旧。{detail}","doctor.msg.node-runtime.too-old.fix":"把 Node.js 升级到 {required} 以上，再运行 `memesh doctor`。","doctor.msg.native-binding.load-failed.summary":"SQLite 无法打开数据库：{detail}。","doctor.msg.native-binding.load-failed.fix":"请检查 Node 运行环境，必要时重新安装 MeMesh。","doctor.msg.shell-cli.not-on-path.summary":"终端里打 `memesh` 找不到命令。Claude Code 的功能不受影响——只影响你自己在终端操作。","doctor.msg.shell-cli.not-on-path.fix":"若要有独立的终端命令，请运行 `npm install -g @pcircle/memesh`。其数据库取决于配置。","doctor.msg.shell-cli.versions.summary":"已安装版本：此界面 {current}；终端 {terminal}。","doctor.msg.plugin-cache.stale.summary":"插件是从 commit {installed} 安装的，但 marketplace 已在同一版本号下前进到 {marketplace}。版本号没变时 {host} 不会刷新缓存，所以你运行的代码比 marketplace 上的旧。","doctor.msg.plugin-cache.stale.fix":"运行 `{command}` 刷新缓存，然后重启 {host}。","doctor.msg.plugin-cache.unverifiable.summary":"无法判断已安装的插件是否与 marketplace 一致。只看版本号不够——两个不同的构建可以有同一个版本号。","doctor.msg.plugin-cache.unverifiable.fix":"运行一次 `{command}`，它会记录 commit，之后这项检查就能判断。","doctor.msg.dashboard.missing.summary":"仪表板的文件不见了。","doctor.msg.dashboard.missing.fix":"用 `cd dashboard && npm install && npm run build` 重建。","doctor.msg.update-status.no-cache.summary":"memesh 还没成功查过有没有新版本，所以无法告诉你要不要更新。","doctor.msg.update-status.no-cache.fix":"联网时运行一次 `memesh status`，查到结果后这条提醒就会消失。","doctor.msg.update-status.deprecated.summary":"你装的 {version} 已被官方下架：{detail}","doctor.msg.update-status.deprecated.fix":"请立即更新——运行 `memesh update`（或按你的安装方式升级）。","doctor.msg.update-status.deprecation-unknown.summary":"无法确认 {version} 这个版本是否仍然安全：{detail}","doctor.msg.update-status.deprecation-unknown.fix":"联网时运行 `memesh status` 重试。","doctor.msg.update-status.update-available.summary":"有新版本：{latest}（当前是 {current}）。","doctor.msg.update-status.update-available.fix":"运行 `memesh update` 升级。","doctor.msg.update-status.stale.summary":"{version} 已是最新，但更新信息有点旧了。","doctor.msg.update-status.stale.fix":"联网时运行 `memesh status` 刷新一下。","doctor.msg.http-probe.bad-status.summary":"{url} 的本机服务器返回了错误（HTTP {status esh doctor` を実行してください。","doctor.msg.native-binding.load-failed.summary":"SQLite がデータベースを開けませんでした: {detail}。","doctor.msg.native-binding.load-failed.fix":"Node の実行環境を確認し、必要なら MeMesh を再インストールしてください。","doctor.msg.shell-cli.not-on-path.summary":"ターミナルで `memesh` コマンドが使えません。Claude Code の機能には影響ありません — 自分で `memesh` と入力するときだけの問題です。","doctor.msg.shell-cli.not-on-path.fix":"別のターミナルコマンドが必要なら、`npm install -g @pcircle/memesh` を実行してください。そのデータベースは設定に依存します。","doctor.msg.shell-cli.versions.summary":"インストール済みバージョン: このインターフェース {current}; ターミナル {terminal}。","doctor.msg.plugin-cache.stale.summary":"プラグインはコミット {installed} からインストールされましたが、marketplace は同じバージョンのまま {marketplace} に進んでいます。バージョンが変わらないと {host} はキャッシュを更新しないため、marketplace より古いコードが動いています。","doctor.msg.plugin-cache.stale.fix":"`{command}` を実行してキャッシュを更新し、{host} を再起動してください。","doctor.msg.plugin-cache.unverifiable.summary":"インストール済みプラグインが marketplace と一致するか判断できませんでした。バージョンだけでは判断できません——異なるビルドが同じバージョンを持つことがあります。","doctor.msg.plugin-cache.unverifiable.fix":"`{command}` を一度実行してください。コミットが記録され、このチェックが判断できるようになります。","doctor.msg.dashboard.missing.summary":"ダッシュボードのファイルが見つかりません。","doctor.msg.dashboard.missing.fix":"`cd dashboard && npm install && npm run build` で作成してください。","doctor.msg.update-status.no-cache.summary":"memesh はまだ新しいバージョンの確認に成功していません。","doctor.msg.update-status.no-cache.fix":"オンラインのときに `memesh status` を一度実行してください。結果が保存され、この通知は消えます。","doctor.msg.update-status.deprecated.summary":"バージョン {version} は提供元によって取り下げられました: {detail}","doctor.msg.update-status.deprecated.fix":"今すぐ更新してください — `memesh update` を実行します（またはお使いのインストール方法に従ってください）。","doctor.msg.update-status.deprecation-unknown.summary":"バージョン {version} が今も安全に使えるか確認できませんでした: {detail}","doctor.msg.update-status.deprecation-unknown.fix":"オンラインのときに `memesh status` を実行して再試行してください。","doctor.msg.update-status.update-available.summary":"新しいバージョンがあります: {latest}（現在は {current}）。","doctor.msg.update-status.update-available.fix":"`memesh update` を実行して更新してください。","doctor.msg.update-status.stale.summary emesh 도구가 시작되지 않습니다.","doctor.msg.mcp-config.entry-missing.fix":"MeMesh를 다시 설치하세요. `.claude-plugin/mcp.json`을 직접 고쳤다면 `${CLAUDE_PLUGIN_ROOT}/dist/mcp/server.js`로 되돌리세요.","doctor.msg.mcp-config.placeholder-unresolved.summary":"확인되지 않음: `.claude-plugin/mcp.json`이 실행하는 경로에 `${CLAUDE_PLUGIN_ROOT}`가 들어 있으며, 이 변수는 Claude Code 플러그인 실행 환경만 채워 넣습니다. 이 설치본은 플러그인으로 실행 중이 아니므로 그 파일은 검사하지 않았습니다.","doctor.msg.mcp-config.placeholder-unresolved.fix":"플러그인 실행 환경과 같은 방식으로 확인하세요: `CLAUDE_PLUGIN_ROOT=<이 설치 폴더> memesh doctor`를 실행합니다.","doctor.msg.hooks-config.missing.summary":"hooks/hooks.json이 없어서 자동 기억 저장이 동작하지 않습니다.","doctor.msg.hooks-config.missing.fix":"MeMesh를 다시 설치하면 복원됩니다.","doctor.msg.hooks-config.invalid-json.summary":"hooks/hooks.json이 손상되었습니다(올바른 JSON이 아님).","doctor.msg.hooks-config.invalid-json.fix":"{path}를 고치거나 MeMesh를 다시 설치하세요.","doctor.msg.hooks-config.missing-types.summary":"hooks/hooks.json에 다음 훅 유형이 없습니다: {types}. 일부 자동 기록이 실행되지 않습니다.","doctor.msg.hooks-config.missing-types.fix":"기본 제공 훅 구성을 복원하거나 MeMesh를 다시 설치하세요.","doctor.msg.hook-scripts.none.summary":"훅 설정에 스크립트가 하나도 없어서 아무것도 자동으로 기록되지 않습니다.","doctor.msg.hook-scripts.none.fix":"MeMesh를 다시 설치하세요.","doctor.msg.hook-scripts.missing.summary":"다음 훅 스크립트가 없습니다: {files}","doctor.msg.hook-scripts.missing.fix":"MeMesh를 다시 설치하면 복원됩니다.","doctor.msg.hook-scripts.not-executable.summary":"다음 훅 스크립트는 있지만 실행 권한이 없습니다: {files}","doctor.msg.hook-scripts.not-executable.fix":"`chmod +x scripts/hooks/*.js`를 실행하세요. 소스 설치라면 `npm run build`를 실행하세요.","doctor.msg.hook-wiring.no-marker.summary":"memesh가 아직 Claude Code에 연결되지 않아 아무것도 자동으로 기억되지 않습니다.","doctor.msg.hook-wiring.no-marker.fix":"`memesh install-hooks`를 한 번 실행한 뒤 `memesh doctor`로 확인하세요.","doctor.msg.hook-wiring.script-missing.summary":"연결된 memesh 훅이 {path}를 가리키지만 이 파일은 더 이상 존재하지 않습니다 — 에이전트가 해당 이벤트마다 없는 파일을 호출합니다. 보통 훅을 은퇴시킨 업그레이드가 남긴 잔재입니다.","doctor.msg.hook-wiring.script-missing.fix":"`memesh install-hooks`를 실행해 다시 연결하고(은퇴한 항목은 제거됩니다) 에이전트를 재시작하세요.","doctor.msg.hook-wiring.marker-unreadable.summary":"{path}의 연결 기록을 읽을 수 없습니다.","doctor.msg.hook-wiring.marker-unreadable.fix":"`memesh install-hooks`를 다시 실행하세요.","doctor.msg.hook-wiring.marker-malformed.summary":"연결 기록이 손상되었습니다.","doctor.msg.hook-wiring.marker-malformed.fix":"`memesh install-hooks`를 다시 실행하세요.","doctor.msg.hook-wiring.settings-missing.summary":"Claude Code 설정 파일({path})이 사라져 연결이 끊어졌습니다.","doctor.msg.hook-wiring.settings-missing.fix":"`memesh install-hooks`를 다시 실행하세요.","doctor.msg.hook-wiring.settings-invalid.summary":"{path}가 손상되었습니다(올바른 JSON이 아님).","doctor.msg.hook-wiring.settings-invalid.fix":"백업에서 복원하거나 `memesh install-hooks`로 다시 만드세요.","doctor.msg.hook-wiring.entries-removed.summary":"{path}에서 memesh 항목이 제거되어 연결이 끊어졌습니다.","doctor.msg.hook-wiring.entries-removed.fix":"`memesh install-hooks`를 다시 실행하세요.","doctor.msg.hook-wiring.root-moved.summary":"연결이 가리키는 {path}가 더 이상 존재하지 않습니다(memesh가 옮겨졌을 수 있음).","doctor.msg.hook-wiring.root-moved.fix":"`memesh install-hooks`를 실행해 갱신하세요.","doctor.msg.hook-activity.never-ran.summary":"추적을 시작한 뒤 {hours}시간 동안 캡처 훅이 한 번도 실행되지 않았습니다. 훅 연결은 정상이므로 실행되어야 할 것이 돌지 않고 있고, 아무것도 기억되지 않고 있습니다.","doctor.msg.hook-activity.never-ran.fix":"작업 세션을 한 번 마친 뒤 `memesh doctor`를 다시 실행하세요. 여전히 훅이 실행되지 않았다고 나오면 `memesh install-hooks`를 실행하고 에이전트를 재시작하세요.","doctor.msg.hook-activity.stale.summary":"마지막 캡처 훅 실행은 약 {hours}시간 전입니다({hook}). 그 뒤로 작업했다면 캡처가 멈춘 것이며 해당 세션의 내용은 저장되지 않았습니다.","doctor.msg.hook-activity.stale.fix":"에이전트를 재시작하고 세션을 한 번 마친 뒤 `memesh doctor`를 다시 실행하세요. 회복되지 않으면 `memesh install-hooks`를 실행하세요.","doctor.msg.hook-activity.stale-unconfirmed.summary":"session-summary 훅이 마지막으로 실행된 것은 약 {hours}시간 전이고, 지난 3일간 Claude Code의 쓰기도 없었습니다. 이 머신이 다른 에이전트(Codex / Gemini)로 옮겨갔다면 정상입니다. 여기서 아직 Claude Code를 쓰고 있다면 캡처가 멈춘 것입니다.","doctor.msg.hook-activity.stale-unconfirmed.fix":"이 머신에서 아직 Claude Code를 쓴다면: 재시작하고 세션을 한 번 끝낸 뒤 `memesh doctor`를 다시 실행하세요. 회복되지 않으면 `memesh install-hooks`를 실행하세요.","doctor.msg.hook-activity.query-failed.summary":'데이터베이스에서 훅 활동을 읽지 못했습니다: {detail}. 캡처 상태는 "알 수 없음"이며 이는 "정상"과 다릅니다.',"doctor.msg.hook-activity.query-failed.fix":"`memesh doctor --verbose`로 전체 오류를 확인하고 ~/.memesh를 읽을 수 있는지, 디스크가 가득 차지 않았는지 확인하세요.","doctor.msg.hook-activity.stale-unknown.summary":'{hook} 훅의 마지막 실행 시각을 읽을 수 없습니다(데이터 손상, 또는 시계가 어긋난 머신이 기록했을 수 있음). 캡처 상태는 "알 수 없음"이며, 이는 "정상"과 같지 않습니다.',"doctor.msg.hook-activity.stale-unknown.fix":"작업 세션을 한 번 끝낸 뒤 `memesh doctor`를 다시 실행하세요. 새 실행이 잘못된 타임스탬프를 덮어씁니다.","doctor.msg.hook-activity.disabled.summary":"자동 캡처가 꺼져 있습니다(MEMESH_AUTO_CAPTURE 또는 설정의 autoCapture). 의도된 설정이므로 훅이 조용한 것은 예상된 동작입니다. 다시 켜면 캡처가 재개됩니다.","doctor.msg.hook-activity.disabled-env.summary":"이 shell 환경의 MEMESH_AUTO_CAPTURE=false 때문에 자동 캡처가 꺼져 있습니다. doctor는 자신의 환경만 볼 수 있습니다 — 에이전트가 이 변수 없이 실행 중이라면 그쪽 캡처는 영향을 받지 않습니다.","doctor.msg.hook-activity.not-wired.summary":"캡처 훅이 한 번도 실행되지 않았습니다 — 그리고 이 머신에는 캡처 훅(Stop / PostToolUse / PreCompact)이 연결된 것이 확인되지 않아, 실행될 것이 애초에 없습니다.","doctor.msg.hook-activity.not-wired.fix":"자동 캡처를 원하면 `memesh install-hooks`를 실행하세요. MCP 전용 설치(Codex / Gemini)라면 정상이며 무시해도 됩니다.","doctor.msg.hook-activity.stop-silent.summary":"{hook} 훅은 기록되고 있지만, 추적을 시작한 지 {hours}시간 동안 session-summary 훅은 한 번도 실행되지 않았습니다. 커밋 캡처에 가려져 세션 캡처가 고장 났을 수 있습니다.","doctor.msg.hook-activity.stop-silent.fix":"작업 세션을 한 번 끝내고 `memesh doctor`를 다시 실행하세요. 그래도 session-summary가 실행되지 않았다면 `memesh install-hooks`를 실행하고 에이전트를 재시작하세요.","doctor.label.capture-liveness":"기록이 계속되는지","doctor.msg.capture-liveness.silent-hook.summary":"{hook}: {runs}번 실행, 0번 기록 — 이유는 '{reason}'입니다. 훅은 살아 있지만 매번 저장할 것이 없다고 판단하고 있으며, 캡처가 망가졌을 때도 똑같이 보입니다.","doctor.msg.capture-liveness.silent-hook.fix":"`memesh doctor --json`으로 훅별 수치를 확인하세요. 그 이유가 실제 사용 방식과 맞지 않으면 `memesh install-hooks`를 실행하고 에이전트를 재시작하세요.","doctor.msg.capture-liveness.type-stopped.summary":"최근 7일 동안 '{type}' 유형이 하나도 저장되지 않았습니다(그 전 7일은 {prev}건). 기억되던 것이 더 이상 기억되지 않고 있습니다.","doctor.msg.capture-liveness.type-stopped.fix":"`memesh doctor --json`으로 훅별 수치를 확인하고 작업 방식이 바뀌었는지 살펴보세요. 바뀌지 않았다면 `memesh install-hooks`를 실행하고 에이전트를 재시작하세요.","doctor.msg.capture-liveness.never-ran.summary":"추적을 시작한 뒤 {hours}시간 동안 {hook} 훅은 기록도 하트비트도 남기지 않았습니다. 한 번도 실행되지 않았으므로 이 훅이 담아야 할 것은 아무것도 저장되지 않았습니다.","doctor.msg.capture-liveness.never-ran.fix":"`memesh install-hooks`를 실행하고 에이전트를 재시작한 뒤, 작업 세션을 한 번 끝내고 `memesh doctor`를 다시 실행하세요.","doctor.msg.capture-liveness.not-wired.summary":"{hook} 훅은 한 번도 실행되지 않았지만 이 컴퓨터에는 캡처 훅이 연결되어 있지 않습니다.","doctor.msg.capture-liveness.not-wired.fix":"자동 캡처를 원하면 `memesh install-hooks`를 실행하세요. MCP 전용(Codex, Gemini, Cursor)이라면 정상입니다.","doctor.msg.capture-liveness.never-ran-legacy.summary":"{hook} 훅의 결과 기록은 없지만 추적 시작 후 자동 캡처 메모리 {captured}개가 저장되었습니다. 이전 버전 훅이 실행 중일 수 있습니다.","doctor.msg.capture-liveness.never-ran-legacy.fix":"MeMesh 훅을 업데이트하고 에이전트를 재시작한 뒤 `memesh doctor`를 다시 실행하세요.","doctor.msg.capture-liveness.query-failed.summary":"데이터베이스에서 캡처 상태를 읽지 못했습니다: {detail}. 무언가 저장되고 있는지 알 수 없으며, 모른다는 것은 정상과 다릅니다.","doctor.msg.capture-liveness.query-failed.fix":"오류는 위에 인용되어 있습니다. ~/.memesh를 읽을 수 있는지, 디스크가 가득 차지 않았는지 확인하세요.","doctor.msg.hook-activity.never-ran-legacy.summary":"하트비트를 기록한 훅은 없지만 추적 시작 이후 {captured}개의 자동 캡처 기억이 저장되었습니다. 하트비트 기능 이전의 구버전 훅이 아직 실행 중일 가능성이 높습니다.","doctor.msg.hook-activity.never-ran-legacy.fix":"memesh 훅을 현재 버전으로 업데이트하고(플러그인: `/plugin update memesh`, npm: `memesh install-hooks`) 에이전트를 재시작하세요.","doctor.msg.node-runtime.too-old.summary":"사용 중인 Node.js가 이 패키지가 지원하는 버전보다 오래되었습니다. {detail}","doctor.msg.node-runtime.too-old.fix":"Node.js를 {required} 이상으로 올린 뒤 `memesh doctor`를 다시 실행하세요.","doctor.msg.native-binding.load-failed.summary":"SQLite가 데이터베이스를 열지 못했습니다: {detail}.","doctor.msg.native-binding.load-failed.fix":"Node 실행 환경을 확인하고 필요한 경우 MeMesh를 다시 설치하세요.","doctor.msg.shell-cli.not-on-path.summary":"터미널에서 `memesh` 명령어를 쓸 수 없습니다. Claude Code 기능은 그대로 동작합니다 — 직접 `memesh`를 입력할 때만 영향이 있습니다.","doctor.msg.shell-cli.not-on-path.fix":"별도의 터미널 명령어가 필요하면 `npm install -g @pcircle/memesh`를 실행하세요. 데이터베이스는 구성에 따라 달라집니다.","doctor.msg.shell-cli.versions.summary":"설치된 버전: 이 인터페이스 {current}; 터미널 sg.hook-activity.not-wired.summary":"Nenhum hook de captura jamais executou — e nenhum hook de captura (Stop / PostToolUse / PreCompact) está confirmado como ligado nesta máquina, então não há nada para executar.","doctor.msg.hook-activity.not-wired.fix":"Se quiser captura automática, execute `memesh install-hooks`. Se esta instalação é só MCP (Codex / Gemini), isto é esperado e pode ser ignorado.","doctor.msg.hook-activity.stop-silent.summary":"O hook {hook} está registando, mas o hook session-summary nunca executou nas {hours} horas desde que o rastreamento começou — a captura de sessões pode estar quebrada, escondida pela captura de commits.","doctor.msg.hook-activity.stop-silent.fix":"Termine uma sessão de trabalho e execute `memesh doctor` de novo. Se o session-summary continuar sem executar, execute `memesh install-hooks` e reinicie o agente.","doctor.label.capture-liveness":"Captura ativa","doctor.msg.capture-liveness.silent-hook.summary":"{hook}: {runs} execuções, 0 gravações — '{reason}'. O hook está vivo e decide todas as vezes que não há nada a guardar, que é também como um caminho de captura quebrado se parece.","doctor.msg.capture-liveness.silent-hook.fix":"Execute `memesh doctor --json` para ver os números por hook. Se o motivo não descreve o seu uso, execute `memesh install-hooks` e reinicie o agente.","doctor.msg.capture-liveness.type-stopped.summary":"Nada do tipo '{type}' foi capturado nos últimos 7 dias, contra {prev} nos 7 dias anteriores. Algo que estava a ser lembrado deixou de ser.","doctor.msg.capture-liveness.type-stopped.fix":"Execute `memesh doctor --json` para ver os números por hook e verifique se a sua forma de trabalhar mudou — se não mudou, execute `memesh install-hooks` e reinicie o agente.","doctor.msg.capture-liveness.never-ran.summary":"O hook {hook} não deixou registo nem heartbeat nas {hours} horas desde que o acompanhamento começou — nunca foi executado, por isso nada do que ele captaria está a ser guardado.","doctor.msg.capture-liveness.never-ran.fix":"Execute `memesh install-hooks` e reinicie o agente, depois termine uma sessão de trabalho e execute `memesh doctor` de novo.","doctor.msg.capture-liveness.not-wired.summary":"O hook {hook} nunca foi executado, mas nenhum hook de captura está ligado nesta máquina.","doctor.msg.capture-liveness.not-wired.fix":"Se quiser captura automática, execute `memesh install-hooks`. Se esta instalação for apenas MCP (Codex, Gemini ou Cursor), isso é esperado.","doctor.msg.capture-liveness.never-ran-legacy.summary":"O hook {hook} não tem registo de resultado, mas {captured} memórias de captura automática foram guardadas desde o início do acompanhamento. Hooks antigos provavelmente ainda estão a correr.","doctor.msg.capture-liveness.never-ran-legacy.fix":"Atualize os hooks do MeMesh, reinicie o agente e execute `memesh doctor` novamente.","doctor.msg.capture-liveness.query-failed.summary":"Não foi possível ler o estado da captura na base de dados: {detail}. Saber se algo está a ser guardado é desconhecido, o que não é o mesmo que saudável.","doctor.msg.capture-liveness.query-failed.fix":"O erro está citado acima. Verifique se ~/.memesh é legível e se o disco não está cheio.","doctor.msg.hook-activity.never-ran-legacy.summary":"Nenhum hook registou o heartbeat, mas {captured} memórias de captura automática chegaram desde que o rastreamento começou — hooks de uma versão anterior ao rastreamento provavelmente ainda estão a executar.","doctor.msg.hook-activity.never-ran-legacy.fix":"Atualize os hooks do memesh para a versão atual (plugin: `/plugin update memesh`; npm: `memesh install-hooks`) e reinicie o agente.","doctor.msg.node-runtime.too-old.summary":"Seu Node.js é mais antigo do que este pacote suporta. {detail}","doctor.msg.node-runtime.too-old.fix":"Atualize o Node.js para {required} ou mais novo e execute `memesh doctor` de novo.","doctor.msg.native-binding.load-failed.summary":"O SQLite não conseguiu abrir o banco de dados: {detail}.","doctor.msg.nat -wiring.marker-unreadable.summary":"Le registre de connexion {path} est illisible.","doctor.msg.hook-wiring.marker-unreadable.fix":"Exécutez de nouveau `memesh install-hooks`.","doctor.msg.hook-wiring.marker-malformed.summary":"Le registre de connexion est endommagé.","doctor.msg.hook-wiring.marker-malformed.fix":"Exécutez de nouveau `memesh install-hooks`.","doctor.msg.hook-wiring.settings-missing.summary":"Le fichier de réglages de Claude Code ({path}) a disparu, la connexion est donc rompue.","doctor.msg.hook-wiring.settings-missing.fix":"Exécutez de nouveau `memesh install-hooks`.","doctor.msg.hook-wiring.settings-invalid.summary":"{path} est endommagé (JSON invalide).","doctor.msg.hook-wiring.settings-invalid.fix":"Restaurez-le depuis une sauvegarde, ou exécutez `memesh install-hooks` pour le recréer.","doctor.msg.hook-wiring.entries-removed.summary":"Les entrées memesh ont été retirées de {path}, la connexion est donc rompue.","doctor.msg.hook-wiring.entries-removed.fix":"Exécutez de nouveau `memesh install-hooks`.","doctor.msg.hook-wiring.root-moved.summary":"La connexion pointe vers {path}, qui n'existe plus (memesh a probablement été déplacé).","doctor.msg.hook-wiring.root-moved.fix":"Exécutez `memesh install-hooks` pour la mettre à jour.","doctor.msg.hook-activity.never-ran.summary":"Aucun hook de capture n'a été exécuté depuis {hours} heures, date de début du suivi, alors que le câblage des hooks est en place — rien n'est mémorisé.","doctor.msg.hook-activity.never-ran.fix":"Terminez une session de travail puis relancez `memesh doctor`. Si le message persiste, exécutez `memesh install-hooks` et redémarrez votre agent.","doctor.msg.hook-activity.stale.summary":"Le dernier hook de capture s'est exécuté il y a environ {hours} heures ({hook}). Si vous avez travaillé depuis, la capture est arrêtée et rien de ces sessions n'a été enregistré.","doctor.msg.hook-activity.stale.fix":"Redémarrez votre agent, terminez une session puis relancez `memesh doctor`. Si cela ne se rétablit pas, exécutez `memesh install-hooks`.","doctor.msg.hook-activity.stale-unconfirmed.summary":"Le hook session-summary a tourné pour la dernière fois il y a environ {hours} heures, et aucune écriture Claude Code n'est arrivée depuis 3 jours non plus. Si cette machine est passée à un autre agent (Codex / Gemini), c'est attendu ; si vous utilisez encore Claude Code ici, la capture s'est arrêtée.","doctor.msg.hook-activity.stale-unconfirmed.fix":"Si vous utilisez encore Claude Code sur cette machine : redémarrez-le, terminez une session, puis relancez `memesh doctor`. S'il ne récupère pas, lancez `memesh install-hooks`.","doctor.msg.hook-activity.query-failed.summary":"Impossible de lire l'activité des hooks dans la base de données : {detail}. L'état de la capture est inconnu, ce qui n'est pas la même chose que sain.","doctor.msg.hook-activity.query-failed.fix":"Lancez `memesh doctor --verbose` pour voir l'erreur complète, et vérifiez que ~/.memesh est lisible et que le disque n'est pas plein.","doctor.msg.hook-activity.stale-unknown.summary":"L'horodatage de la dernière exécution du hook {hook} est illisible (corrompu, ou écrit par une machine à l'horloge déréglée). L'état de la capture est « inconnu », ce qui n'est pas la même chose que « sain ».","doctor.msg.hook-activity.stale-unknown.fix":"Terminez une session de travail puis relancez `memesh doctor` — une nouvelle exécution écrase l'horodatage invalide.","doctor.msg.hook-activity.disabled.summary":"La capture automatique est désactivée (MEMESH_AUTO_CAPTURE ou autoCapture dans la configuration) — délibérément, le silence des hooks est donc attendu. Réactivez-la pour reprendre la capture.","doctor.msg.hook-activity.disabled-env.summary":"La capture automatique est désactivée par MEMESH_AUTO_CAPTURE=false dans l'environnement de ce shell. doctor ne voit que son propre environnement — si votre agent tourne sans cette variable, la capture là-bas n'est pas affectée.","doctor.msg.hook-activity.not-wired.summary":"Aucun hook de capture n'a jamais tourné — et aucun hook de capture (Stop / PostToolUse / PreCompact) n'est confirmé câblé sur cette machine, il n'y a donc rien à exécuter.","doctor.msg.hook-activity.not-wired.fix":"Pour la capture automatique, lancez `memesh install-hooks`. Si cette installation est MCP uniquement (Codex / Gemini), c'est normal et vous pouvez l'ignorer.","doctor.msg.hook-activity.stop-silent.summary":"Le hook {hook} s'enregistre, mais le hook session-summary n'a jamais tourné une seule fois en {hours} heures de suivi — la capture de session est peut-être cassée, masquée par la capture des commits.","doctor.msg.hook-activity.stop-silent.fix":"Terminez une session de travail puis relancez `memesh doctor`. Si session-summary n'a toujours pas tourné, lancez `memesh install-hooks` et redémarrez l'agent.","doctor.label.capture-liveness":"Capture active","doctor.msg.capture-liveness.silent-hook.summary":"{hook} : {runs} exécutions, 0 écriture — « {reason} ». Le hook est vivant et décide chaque fois qu'il n'y a rien à enregistrer, ce à quoi ressemble aussi une capture cassée.","doctor.msg.capture-liveness.silent-hook.fix":"Lancez `memesh doctor --json` pour les chiffres par hook. Si la raison ne correspond pas à votre usage, lancez `memesh install-hooks` et redémarrez l'agent.","doctor.msg.capture-liveness.type-stopped.summary":"Rien du type « {type} » n'a été capturé ces 7 derniers jours, contre {prev} les 7 jours précédents. Quelque chose qui était mémorisé ne l'est plus.","doctor.msg.capture-liveness.type-stopped.fix":"Lancez `memesh doctor --json` pour les chiffres par hook et vérifiez si votre façon de travailler a changé — sinon, lancez `memesh install-hooks` et redémarrez l'agent.","doctor.msg.capture-liveness.never-ran.summary":"Le hook {hook} n'a laissé ni enregistrement ni battement depuis {hours} heures de suivi : il n'a jamais tourné, donc rien de ce qu'il capterait n'est enregistré.","doctor.msg.capture-liveness.never-ran.fix":"Lancez `memesh install-hooks` et redémarrez l'agent, puis terminez une session de travail et relancez `memesh doctor`.","doctor.msg.capture-liveness.not-wired.summary":"Le hook {hook} n'a jamais fonctionné, mais aucun hook de capture n'est connecté sur cette machine.","doctor.msg.capture-liveness.not-wired.fix":"Pour activer la capture automatique, lancez `memesh install-hooks`. Si cette installation est uniquement MCP (Codex, Gemini ou Cursor), c'est normal.","doctor.msg.capture-liveness.never-ran-legacy.summary":"Le hook {hook} n'a aucun enregistrement de résultat, mais {captured} mémoires ont été capturées depuis le début du suivi. Des hooks anciens fonctionnent probablement encore.","doctor.msg.capture-liveness.never-ran-legacy.fix":"Mettez à jour les hooks MeMesh, redémarrez l'agent et relancez `memesh doctor`.","doctor.msg.capture-liveness.query-failed.summary":"Impossible de lire l'état de la capture depuis la base : {detail}. On ignore si quoi que ce soit est enregistré, et ignorer n'est pas la même chose que sain.","doctor.msg.capture-liveness.query-failed.fix":"L'erreur est citée ci-dessus. Vérifiez que ~/.memesh est lisible et que le disque n'est pas plein.","doctor.msg.hook-activity.never-ran-legacy.summary":"Aucun hook n'a enregistré le heartbeat, mais {captured} mémoires de capture automatique sont arrivées depuis le début du suivi — des hooks d'une version antérieure au suivi tournent probablement encore.","doctor.msg.hook-activity.never-ran-legacy.fix":"Mettez à jour les hooks memesh vers la version actuelle (plugin : `/plugin update memesh` ; npm : `memesh install-hooks`), puis redémarrez l'agent.","doctor.msg.node-runtime.too-old.summary":"Votre Node.js est plus ancien que ce que ce paquet prend en charge. {detail}","doctor.msg.node-runtime.too-old.fix":"Mettez Node.js à niveau vers {required} ou plus récent, puis relancez `memesh doctor`.","doctor.msg.native-binding.load-failed.summary":"SQLite n’a pas pu ouvrir la base de données : {detail}.","doctor.msg.native-binding.load-failed.fix":"Vérifiez l’environnement Node et réinstallez MeMesh si nécessaire.","doctor.msg.shell-cli.not-on-path.summary":"La commande `memesh` n'est pas disponible dans votre terminal. Les fonctions de Claude Code continuent de marcher — cela ne concerne que la saisie de `memesh` par vous-même.","doctor.msg.shell-cli.not-on-path.fix":"Exécutez `npm install -g @pcircle/memesh` si vous voulez une commande de terminal distincte. Sa base de données dépend de sa configuration.","doctor.msg.shell-cli.versions.summary":"Versions installées : cette interface {current} ; terminal {terminal}.","doctor.msg.plugin-cache.stale.summary":"Le plugin a été installé depuis le commit {installed}, mais le marketplace est passé à {marketplace} sous la même version. {host} ne rafraîchit pas un cache dont la version n’a pas changé : vous exécutez donc un code plus ancien que celui du marketplace.","doctor.msg.plugin-cache.stale.fix":"Exécutez `{command}` pour rafraîchir le cache, puis redémarrez {host}.","doctor.msg.plugin-cache.unverifiable.summary":"Impossible de savoir si le plugin installé correspond au marketplace. La version seule ne suffit pas : deux builds peuvent porter la même version.","doctor.msg.plugin-cache.unverifiable.fix":"Exécutez `{command}` une fois ; il enregistre le commit et cette vérification pourra répondre.","doctor.msg.dashboard.missing.summary":"Les fichiers du tableau de bord sont introuvables.","doctor.msg.dashboard.missing.fix":"Générez-les avec `cd dashboard && npm install && npm run build`.","doctor.msg.update-status.no-cache.summary":"memesh n'a pas encore réussi à vérifier s'il existe des versions plus récentes.","doctor.msg.update-status.no-cache.fix":"Exécutez `memesh status` une fois en ligne — la réponse est mémorisée et cet avis disparaît.","doctor.msg.update-status.deprecated.summary":"La version {version} a été retirée par ses mainteneurs : {detail}","doctor.msg.update-status.deprecated.fix":"Mettez à jour maintenant — exéc ode ist aktuell","doctor.label.shell-cli":"Terminal-Befehl","doctor.label.dashboard":"Dashboard-Dateien","doctor.label.update-status":"Updates","doctor.label.http-probe":"Lokaler Server","doctor.label.skills-manifest":"Mitgelieferte Dateien","doctor.label.config_parse":"Konfigurationsdatei","doctor.label.install-channel":"Installationsart","doctor.label.fts_segmentation":"Stichwort-Index","doctor.label.database":"Datenbank","doctor.msg.readme-parity.unreadable.summary":"README.md konnte nicht gelesen werden: {detail}","doctor.msg.readme-parity.drift.summary":"Einige übersetzte READMEs sind nicht mehr auf dem Stand der englischen Version: {detail}","doctor.msg.readme-parity.drift.fix":"Gleichen Sie die aufgelisteten READMEs wieder mit README.md ab.","doctor.msg.config.invalid-json.summary":"Die Konfigurationsdatei unter {path} ist kein gültiges JSON und wird deshalb ignoriert.","doctor.msg.config.invalid-json.fix":"Reparieren oder löschen Sie {path} und prüfen Sie mit `memesh config list`, ob sie geladen wird.","doctor.msg.mcp-config.missing.summary":"Die Datei, die memesh mit Claude Code verbindet (.claude-plugin/mcp.json), fehlt.","doctor.msg.mcp-config.missing.fix":"Installieren Sie MeMesh neu, um sie wiederherzustellen.","doctor.msg.mcp-config.invalid-json.summary":".claude-plugin/mcp.json ist beschädigt (kein gültiges JSON), Claude Code kann sie deshalb nicht lesen.","doctor.msg.mcp-config.invalid-json.fix":"Reparieren Sie {path} oder installieren Sie MeMesh neu.","doctor.msg.mcp-config.no-entry.summary":".claude-plugin/mcp.json enthält den memesh-Servereintrag nicht mehr.","doctor.msg.mcp-config.no-entry.fix":"Installieren Sie MeMesh neu, um ihn wiederherzustellen.","doctor.msg.mcp-config.entry-missing.summary":"`.claude-plugin/mcp.json` startet eine Datei, die in dieser Installation fehlt — daher startet kein memesh-Werkzeug in Claude Code.","doctor.msg.mcp-config.entry-missing.fix":"Installieren Sie MeMesh neu. Wenn Sie `.claude-plugin/mcp.json` von Hand geändert haben, richten Sie es wieder auf `${CLAUDE_PLUGIN_ROOT}/dist/mcp/server.js` aus.","doctor.msg.mcp-config.placeholder-unresolved.summary":"NICHT GEPRÜFT: `.claude-plugin/mcp.json` startet einen Pfad mit `${CLAUDE_PLUGIN_ROOT}` — diese Variable setzt nur die Plugin-Laufzeit von Claude Code ein. Diese Kopie läuft nicht als Plugin, daher wurde die genannte Datei nicht geprüft.","doctor.msg.mcp-config.placeholder-unresolved.fix":"Prüfen Sie es so, wie es die Plugin-Laufzeit täte: `CLAUDE_PLUGIN_ROOT=<Ordner dieser Installation> memesh doctor` ausführen.","doctor.msg.hooks-config.missing.summary":"hooks/hooks.json fehlt, die automatische Erinnerungs-Erfassung kann deshalb nicht laufen.","doctor.msg.hooks-config.missing.fix":"Installieren Sie MeMesh neu, um sie wiederherzustellen.","doctor.msg.hooks-config.invalid-json.summary":"hooks/hooks.json ist beschädigt (kein gültiges JSON).","doctor.msg.hooks-config.invalid-json.fix":"Reparieren Sie {path} oder installieren Sie MeMesh neu.","doctor.msg.hooks-config.missing-types.summary":"In hooks/hooks.json fehlen diese Hook-Typen: {types}. Ein Teil der automatischen Erfassung läuft nicht.","doctor.msg.hooks-config.missing-types.fix":"Stellen Sie die mitgelieferte Hook-Konfiguration wieder her oder installieren Sie MeMesh neu.","doctor.msg.hook-scripts.none.summary":"Die Hook-Konfiguration enthält keine Skripte, es kann also nichts automatisch erfasst werden.","doctor.msg.hook-scripts.none.fix":"Installieren Sie MeMesh neu.","doctor.msg.hook-scripts.missing.summary":"Diese Hook-Skripte fehlen: {files}","doctor.msg.hook-scripts.missing.fix":"Installieren Sie MeMesh neu, um sie wiederherzustellen.","doctor.msg.hook-scripts.not-executable.summary":"Diese Hook-Skripte existieren, dürfen aber nicht ausgeführt werden: {files}","doctor.msg.hook-scripts.not-executable.fix":"Führen Sie `chmod +x scripts/hooks/*.js` aus, oder `npm run build` in einem Quellcode-Checkout.","doctor.msg.hook-wiring.no-marker.summary":"memesh ist noch nicht mit Claude Code verbunden, es wird also nichts automatisch gemerkt.","doctor.msg.hook-wiring.no-marker.fix":"Führen Sie einmal `memesh install-hooks` aus, danach `memesh doctor` zur Kontrolle.","doctor.msg.hook-wiring.script-missing.summary":"Ein verdrahteter memesh-Hook zeigt auf {path}, das nicht mehr existiert — der Agent ruft bei jedem passenden Ereignis eine fehlende Datei auf. Meist ein Rückstand eines Upgrades, das den Hook stillgelegt hat.","doctor.msg.hook-wiring.script-missing.fix":"Führen Sie `memesh install-hooks` aus (stillgelegte Einträge werden entfernt) und starten Sie den Agenten neu.","doctor.msg.hook-wiring.marker-unreadable.summary":"Der Verbindungsvermerk unter {path} kann nicht gelesen werden.","doctor.msg.hook-wiring.marker-unreadable.fix":"Führen Sie `memesh install-hooks` erneut aus.","doctor.msg.hook-wiring.marker-malformed.summary":"Der Verbindungsvermerk ist beschädigt.","doctor.msg.hook-wiring.marker-malformed.fix":"Führen Sie `memesh install-hooks` erneut aus.","doctor.msg.hook-wiring.settings-missing.summary":"Die Claude-Code-Einstellungsdatei ({path}) ist weg, die Verbindung ist deshalb unterbrochen.","doctor.msg.hook-wiring.settings-missing.fix":"Führen Sie `memesh install-hooks` erneut aus.","doctor.msg.hook-wiring.settings-invalid.summary":"{path} ist beschädigt (kein gültiges JSON).","doctor.msg.hook-wiring.settings-invalid.fix":"Stellen Sie die Datei aus einem Backup wieder her, oder führen Sie `memesh install-hooks` aus, um sie neu anzulegen.","doctor.msg.hook-wiring.entries-removed.summary":"Die memesh-Einträge wurden aus {path} entfernt, die Verbindung ist deshalb unterbrochen.","doctor.msg.hook-wiring.entries-removed.fix":"Führen Sie `memesh install-hooks` erneut aus.","doctor.msg.hook-wiring.root-moved.summary":"Die Verbindung zeigt auf {path}, das es nicht mehr gibt (memesh wurde vermutlich verschoben).","doctor.msg.hook-wiring.root-moved.fix":"Führen Sie `memesh install-hooks` aus, um sie zu aktualisieren.","doctor.msg.hook-activity.never-ran.summary":"Seit Beginn der Aufzeichnung vor {hours} Stunden wurde kein Capture-Hook ausgeführt, obwohl die Hook-Verdrahtung vorhanden ist — nichts wird gespeichert.","doctor.msg.hook-activity.never-ran.fix":"Beenden Sie eine Arbeitssitzung und führen Sie `memesh doctor` erneut aus. Steht dort weiterhin, dass kein Hook lief, führen Sie `memesh install-hooks` aus und starten Sie den Agenten neu.","doctor.msg.hook-activity.stale.summary":"Der letzte Capture-Hook lief vor etwa {hours} Stunden ({hook}). Wenn Sie seitdem gearbeitet haben, ist die Erfassung gestoppt und nichts aus diesen Sitzungen wurde gespeichert.","doctor.msg.hook-activity.stale.fix":"Starten Sie den Agenten neu, beenden Sie eine Sitzung und führen Sie `memesh doctor` erneut aus. Erholt es sich nicht, führen Sie `memesh install-hooks` aus.","doctor.msg.hook-activity.stale-unconfirmed.summary":"Der session-summary-Hook lief zuletzt vor etwa {hours} Stunden, und in den letzten 3 Tagen kamen auch keine Claude-Code-Schreibvorgänge an. Ist diese Maschine zu einem anderen Agenten (Codex / Gemini) gewechselt, ist das erwartet; nutzen Sie hier noch Claude Code, ist die Erfassung gestoppt.","doctor.msg.hook-activity.stale-unconfirmed.fix":"Wenn Sie auf dieser Maschine noch Claude Code nutzen: neu starten, eine Sitzung beenden und `memesh doctor` erneut ausführen. Erholt es sich nicht, führen Sie `memesh install-hooks` aus.","doctor.msg.hook-activity.query-failed.summary":"Die Hook-Aktivität konnte nicht aus der Datenbank gelesen werden: {detail}. Der Zustand der Erfassung ist unbekannt, und das ist nicht dasselbe wie gesund.","doctor.msg.hook-activity.query-failed.fix":"Führen Sie `memesh doctor --verbose` für den vollständigen Fehler aus und prüfen Sie, ob ~/.memesh lesbar und die Festplatte nicht voll ist.","doctor.msg.hook-activity.stale-unknown.summary":'Der Zeitstempel des letzten Laufs des {hook}-Hooks ist unlesbar (beschädigt, oder von einer Maschine mit falscher Uhr geschrieben). Der Capture-Zustand ist „unbekannt", und das ist nicht dasselbe wie „gesund".',"doctor.msg.hook-activity.stale-unknown.fix":"Beenden Sie eine Arbeitssitzung und führen Sie `memesh doctor` erneut aus — ein frischer Lauf überschreibt den defekten Zeitstempel.","doctor.msg.hook-activity.disabled.summary":"Die automatische Erfassung ist ausgeschaltet (MEMESH_AUTO_CAPTURE oder autoCapture in der Konfiguration) — absichtlich, daher ist die Stille der Hooks zu erwarten. Zum Fortsetzen wieder einschalten.","doctor.msg.hook-activity.disabled-env.summary":"Die automatische Erfassung ist durch MEMESH_AUTO_CAPTURE=false in der Umgebung dieser Shell ausgeschaltet. doctor sieht nur seine eigene Umgebung — läuft Ihr Agent ohne diese Variable, ist die Erfassung dort nicht betroffen.","doctor.msg.hook-activity.not-wired.summary":"Es ist noch nie ein Capture-Hook gelaufen — und auf dieser Maschine ist kein Capture-Hook (Stop / PostToolUse / PreCompact) nachweislich verdrahtet, es gibt also nichts auszuführen.","doctor.msg.hook-activity.not-wired.fix":"Für automatische Erfassung führen Sie `memesh install-hooks` aus. Bei einer reinen MCP-Installation (Codex / Gemini) ist das erwartet und kann ignoriert werden.","doctor.msg.hook-activity.stop-silent.summary":"Der {hook}-Hook stempelt, aber der session-summary-Hook ist in den {hours} Stunden seit Beginn der Aufzeichnung kein einziges Mal gelaufen — die Sitzungserfassung ist womöglich kaputt, verdeckt durch die Commit-Erfassung.","doctor.msg.hook-activity.stop-silent.fix":"Beenden Sie eine Arbeitssitzung und führen Sie `memesh doctor` erneut aus. Läuft session-summary dann immer noch nicht, führen Sie `memesh install-hooks` aus und starten Sie den Agenten neu.","doctor.label.capture-liveness":"Erfassung lebendig","doctor.msg.capture-liveness.silent-hook.summary":"{hook}: {runs} Läufe, 0 Schreibvorgänge — „{reason}“. Der Hook läuft und entscheidet jedes Mal, dass es nichts zu speichern gibt — genauso sieht auch eine kaputte Erfassung aus.","doctor.msg.capture-liveness.silent-hook.fix":"Führen Sie `memesh doctor --json` für die Zahlen je Hook aus. Passt der Grund nicht zu Ihrer Arbeitsweise, führen Sie `memesh install-hooks` aus und starten Sie den Agenten neu.","doctor.msg.capture-liveness.type-stopped.summary":"In den letzten 7 Tagen wurde nichts vom Typ „{type}“ erfasst, in den 7 Tagen davor {prev}. Etwas, das erinnert wurde, wird nicht mehr erinnert.","doctor.msg.capture-liveness.type-stopped.fix":"Führen Sie `memesh doctor --json` für die Zahlen je Hook aus und prüfen Sie, ob sich Ihre Arbeitsweise geändert hat — wenn nicht, führen Sie `memesh install-hooks` aus und starten Sie den Agenten neu.","doctor.msg.capture-liveness.never-ran.summary":"Der Hook {hook} hat in den {hours} Stunden seit Beginn der Aufzeichnung weder einen Eintrag noch einen Herzschlag hinterlassen — er lief nie, also wird nichts gespeichert, was er erfassen würde.","doctor.msg.capture-liveness.never-ran.fix":"Führen Sie `memesh install-hooks` aus, starten Sie den Agenten neu, beenden Sie eine Arbeitssitzung und führen Sie `memesh doctor` erneut aus.","doctor.msg.capture-liveness.not-wired.summary":"Der Hook {hook} wurde noch nie ausgeführt, aber auf diesem Rechner ist kein Erfassungs-Hook verbunden.","doctor.msg.capture-liveness.not-wired.fix":"Für automatische Erfassung führen Sie `memesh install-hooks` aus. Bei einer reinen MCP-Installation (Codex, Gemini oder Cursor) ist dies erwartbar.","doctor.msg.capture-liveness.never-ran-legacy.summary":"Der Hook {hook} hat keinen Ergebnis-Eintrag, aber seit Beginn der Überwachung wurden {captured} automatische Erinnerungen gespeichert. Wahrscheinlich laufen noch ältere Hooks.","doctor.msg.capture-liveness.never-ran-legacy.fix":"Aktualisieren Sie die MeMesh-Hooks, starten Sie den Agenten neu und führen Sie `memesh doctor` erneut aus.","doctor.msg.capture-liveness.query-failed.summary":"Der Erfassungsstatus konnte nicht aus der Datenbank gelesen werden: {detail}. Ob überhaupt etwas gespeichert wird, ist unbekannt — und unbekannt ist nicht dasselbe wie gesund.","doctor.msg.capture-liveness.query-failed.fix":"Der Fehler steht oben. Prüfen Sie, ob ~/.memesh lesbar ist und die Festplatte nicht voll ist.","doctor.msg.hook-activity.never-ran-legacy.summary":"Kein Hook hat den Heartbeat gestempelt, aber seit Beginn der Aufzeichnung sind {captured} automatisch erfasste Erinnerungen angekommen — Hooks aus einer Version vor dem Heartbeat-Tracking laufen wahrscheinlich noch.","doctor.msg.hook-activity.never-ran-legacy.fix":"Aktualisieren Sie die memesh-Hooks auf die aktuelle Version (Plugin: `/plugin update memesh`; npm: `memesh install-hooks`) und starten Sie den Agenten neu.","doctor.msg.node-runtime.too-old.summary":"Ihr Node.js ist älter, als dieses Paket unterstützt. {detail}","doctor.msg.node-runtime.too-old.fix":"Aktualisieren Sie Node.js auf {required} oder neuer und führen Sie `memesh doctor` erneut aus.","doctor.msg.native-binding.load-failed.summary":"SQLite konnte die Datenbank nicht öffnen: {detail}.","doctor.msg.native-binding.load-failed.fix":"Prüfen Sie die Node-Laufzeit und installieren Sie MeMesh bei Bedarf neu.","doctor.msg.shell-cli.not-on-path.summary":"Der Befehl `memesh` ist in Ihrem Terminal nicht verfügbar. Die Claude-Code-Funktionen laufen weiter — es betrifft nur das eigene Eintippen von `memesh`.","doctor.msg.shell-cli.not-on-path.fix":"Führen Sie `npm install -g @pcircle/memesh` aus, wenn Sie einen separaten Terminal-Befehl möchten. Seine Datenbank hängt von seiner Konfiguration ab.","doctor.msg.shell-cli.versions.summary":"Installierte Versionen: diese Oberfläche {current}; Terminal {terminal}.","doctor.msg.plugin-cache.stale.summary":"Das Plugin wurde aus Commit {installed} installiert, der Marketplace ist aber unter derselben Version zu {marketplace} weitergegangen. {host} aktualisiert keinen Cache, dessen Version sich nicht geändert hat — Sie führen also älteren Code aus als der Marketplace hat.","doctor.msg.plugin-cache.stale.fix":"Führen Sie `{command}` aus, um den Cache zu erneuern, und starten Sie {host} dann neu.","doctor.msg.plugin-cache.unverifiable.summary":"Ob das installierte Plugin dem Marketplace entspricht, ließ sich nicht feststellen. Die Version allein reicht nicht — zwei Builds können dieselbe Version tragen.","doctor.msg.plugin-cache.unverifiable.fix":"Führen Sie `{command}` einmal aus; es zeichnet den Commit auf, danach kann diese Prüfung antworten.","doctor.msg.dashboard.missing.summary":"Die Dashboard-Dateien fehlen.","doctor.msg.dashboard.missing.fix":"Erzeugen Sie sie mit `cd dashboard && npm install && npm run build`.","doctor.msg.update-status.no-cache.summary":"memesh konnte noch nicht prüfen, ob es neuere Versionen gibt.","doctor.msg.update-status.no-cache.fix":"Führen Sie einmal online `memesh status` aus — das Ergebnis wird gespeichert und dieser Hinweis verschwindet.","doctor.msg.update-status.deprecated.summary":"Version {version} wurde von ihren Betreuern zurückgezogen: {detail}","doctor.msg.update-status.deprecated.fix":"Aktualisieren Sie jetzt — führen Sie `memesh update` aus (oder folgen Sie Ihrer Installationsart).","doctor.msg.update-status.deprecation-unknown.summary":"Es ließ sich nicht bestätigen, ob Version {version} noch sicher ist: {detail}","doctor.msg.update-status.deprecation-unknown.fix":"Führen Sie online `memesh status` aus, um es erneut zu versuchen.","doctor.msg.update-status.update-available.summary":"Eine neuere Version ist verfügbar: {latest} (Sie haben {current}).","doctor.msg.update-status.update-available.fix":"Führen Sie `memesh update` aus, um zu aktualisieren.","doctor.msg.update-status.stale.summary":"Version {version} ist aktuell, aber die Update-Informationen sind alt.","doctor.msg.update-status.stale.fix":"Führen Sie online `memesh status` aus, um sie zu erneuern.","doctor.msg.http-probe.bad-status.summary":"Der lokale Server unter {url} hat mit einem Fehler geantwortet (HTTP {status}).","doctor.msg.http-probe.bad-status.fix":"Starten Sie ihn mit `memesh serve` neu und sehen Sie in die Logs.","doctor.msg.http-probe.no-server.summary":"Unter {url} läuft kein lokaler Server.","doctor.msg.http-probe.no-server.fix":"Starten Sie einen mit `memesh serve`, wenn Sie das Dashboard möchten.","doctor.msg.skills-manifest.missing-dev.summary":"Keine Datei-Integritätsliste gefunden (normal, wenn Sie aus dem Quellcode starten).","doctor.msg.skills-manifest.missing-dev.fix":"Führen Sie `npm run build` aus, um sie zu erzeugen.","doctor.msg.skills-manifest.unreadable.summary":"Die Datei-Integritätsliste kann nicht gelesen werden ({detail}).","doctor.msg.skills-manifest.unreadable.fix":"Neu installieren: `npm install -g @pcircle/memesh`.","doctor.msg.skills-manifest.empty.summary":"Die Datei-Integritätsliste ist leer.","doctor.msg.skills-manifest.empty.fix":"Neu installieren: `npm install -g @pcircle/memesh`.","doctor.msg.skills-manifest.verify-failed.summary":"Einige mitgelieferte Dateien stimmen nicht mit dem Ausgelieferten überein: {detail}","doctor.msg.skills-manifest.verify-failed.fix":"Neu installieren: `npm install -g @pcircle/memesh`. Passiert es auch bei einer frischen Installation wieder, melden Sie es als Sicherheitsproblem.","doctor.msg.config-parse.not-object.summary":"Die Konfigurationsdatei unter {path} hat nicht das erwartete Format, alle Einstellungen werden deshalb ignoriert.","doctor.msg.config-parse.not-object.fix":"Reparieren oder löschen Sie {path} und führen Sie `memesh doctor` erneut aus.","doctor.msg.config-parse.unreadable.summary":"Die Konfigurationsdatei unter {path} kann nicht gelesen werden ({detail}), alle Einstellungen werden deshalb ignoriert.","doctor.msg.config-parse.unreadable.fix":"Reparieren Sie die Datei, oder legen Sie sie beiseite: mv {path} {path}.bak","doctor.msg.config-parse.retired-settings.summary":"Die gültige Konfigurationsdatei unter {path} enthält noch {count} eingestellte Werte auf oberster Ebene, die nicht mehr unterstützt werden ({keys}). Diese Version ục.","doctor.msg.mcp-config.entry-missing.summary":"`.claude-plugin/mcp.json` khởi chạy một tệp không có trong bản cài này, nên mọi công cụ memesh trong Claude Code đều không khởi động được.","doctor.msg.mcp-config.entry-missing.fix":"Cài lại MeMesh. Nếu bạn tự sửa `.claude-plugin/mcp.json`, hãy trỏ nó về `${CLAUDE_PLUGIN_ROOT}/dist/mcp/server.js`.","doctor.msg.mcp-config.placeholder-unresolved.summary":"CHƯA KIỂM TRA: `.claude-plugin/mcp.json` khởi chạy một đường dẫn có chứa `${CLAUDE_PLUGIN_ROOT}`, biến mà chỉ môi trường chạy plugin của Claude Code mới thay thế. Bản cài này không chạy như một plugin, nên tệp mà nó trỏ tới chưa được kiểm tra.","doctor.msg.mcp-config.placeholder-unresolved.fix":"Hãy kiểm tra đúng cách môi trường plugin làm: chạy `CLAUDE_PLUGIN_ROOT=<thư mục của bản cài này> memesh doctor`.","doctor.msg.hooks-config.missing.summary":"hooks/hooks.json đã biến mất nên tính năng ghi nhớ tự động không chạy được.","doctor.msg.hooks-config.missing.fix":"Cài lại MeMesh để khôi phục.","doctor.msg.hooks-config.invalid-json.summary":"hooks/hooks.json bị hỏng (không phải JSON hợp lệ).","doctor.msg.hooks-config.invalid-json.fix":"Sửa {path} hoặc cài lại MeMesh.","doctor.msg.hooks-config.missing-types.summary":"hooks/hooks.json thiếu các loại hook sau: {types}. Một phần ghi nhận tự động sẽ không chạy.","doctor.msg.hooks-config.missing-types.fix":"Khôi phục cấu hình hook gốc hoặc cài đặt lại MeMesh.","doctor.msg.hook-scripts.none.summary":"Cấu hình hook không có script nào nên không thể ghi tự động thứ gì.","doctor.msg.hook-scripts.none.fix":"Cài lại MeMesh.","doctor.msg.hook-scripts.missing.summary":"Các script hook sau đã biến mất: {files}","doctor.msg.hook-scripts.missing.fix":"Cài lại MeMesh để khôi phục.","doctor.msg.hook-scripts.not-executable.summary":"Các script hook sau tồn tại nhưng không được phép chạy: {files}","doctor.msg.hook-scripts.not-executable.fix":"Chạy `chmod +x scripts/hooks/*.js`, hoặc `npm run build` nếu dùng mã nguồn.","doctor.msg.hook-wiring.no-marker.summary":"memesh chưa được nối với Claude Code nên chưa có gì được ghi nhớ tự động.","doctor.msg.hook-wiring.no-marker.fix":"Chạy `memesh install-hooks` một lần, rồi chạy `memesh doctor` để xác nhận.","doctor.msg.hook-wiring.script-missing.summary":"Một hook memesh đã đấu nối trỏ tới {path}, nhưng tệp này không còn tồn tại — agent gọi một tệp không có ở mỗi sự kiện tương ứng. Thường là tàn dư của bản nâng cấp đã loại bỏ hook đó.","doctor.msg.hook-wiring.script-missing.fix":"Chạy `memesh install-hooks` để đấu nối lại (các mục đã loại bỏ sẽ bị xoá), rồi khởi động lại agent.","doctor.msg.hook-wiring.marker-unreadable.summary":"Không đọc được bản ghi kết nối tại {path}.","doctor.msg.hook-wiring.marker-unreadable.fix":"Chạy lại `memesh install-hooks`.","doctor.msg.hook-wiring.marker-malformed.summary":"Bản ghi kết nối bị hỏng.","doctor.msg.hook-wiring.marker-malformed.fix":"Chạy lại `memesh install-hooks`.","doctor.msg.hook-wiring.settings-missing.summary":"Tệp cài đặt của Claude Code ({path}) đã biến mất nên kết nối bị đứt.","doctor.msg.hook-wiring.settings-missing.fix":"Chạy lại `memesh install-hooks`.","doctor.msg.hook-wiring.settings-invalid.summary":"{path} bị hỏng (không phải JSON hợp lệ).","doctor.msg.hook-wiring.settings-invalid.fix":"Khôi phục từ bản sao lưu, hoặc chạy `memesh install-hooks` để tạo lại.","doctor.msg.hook-wiring.entries-removed.summary":"Các mục memesh đã bị gỡ khỏi {path} nên kết nối bị đứt.","doctor.msg.hook-wiring.entries-removed.fix":"Chạy lại `memesh install-hooks`.","doctor.msg.hook-wiring.root-moved.summary":"Kết nối trỏ tới {path}, nơi này không còn tồn tại (memesh có lẽ đã bị di chuyển).","doctor.msg.hook-wiring.root-moved.fix":"Chạy `memesh install-hooks` để cập nhật.","doctor.msg.hook-activity.never-ran.summary":"Không có hook thu thập nào chạy trong {hours} giờ kể từ khi bắt đầu theo dõi, dù đấu nối hook vẫn ổn — không có gì được ghi nhớ.","doctor.msg.hook-activity.never-ran.fix":"Hoàn tất một phiên làm việc rồi chạy lại `memesh doctor`. Nếu vẫn báo chưa có hook nào chạy, chạy `memesh install-hooks` rồi khởi động lại agent.","doctor.msg.hook-activity.stale.summary":"Hook thu thập cuối cùng chạy khoảng {hours} giờ trước ({hook}). Nếu bạn đã làm việc kể từ đó, việc thu thập đã dừng và không có gì từ các phiên đó được lưu.","doctor.msg.hook-activity.stale.fix":"Khởi động lại agent, kết thúc một phiên rồi chạy lại `memesh doctor`. Nếu không khôi phục, chạy `memesh install-hooks`.","doctor.msg.hook-activity.stale-unconfirmed.summary":"Hook session-summary chạy lần cuối khoảng {hours} giờ trước, và 3 ngày qua cũng không có ghi nào từ Claude Code. Nếu máy này đã chuyển sang agent khác (Codex / Gemini), điều này là bình thường; nếu bạn vẫn dùng Claude Code ở đây, thu thập đã dừng.","doctor.msg.hook-activity.stale-unconfirmed.fix":"Nếu bạn vẫn dùng Claude Code trên máy này: khởi động lại, kết thúc một phiên rồi chạy lại `memesh doctor`. Nếu không hồi phục, chạy `memesh install-hooks`.","doctor.msg.hook-activity.query-failed.summary":"Không đọc được hoạt động hook từ cơ sở dữ liệu: {detail}. Tình trạng thu thập là không rõ, và điều đó không giống với bình thường.","doctor.msg.hook-activity.query-failed.fix":"Chạy `memesh doctor --verbose` để xem lỗi đầy đủ, và kiểm tra ~/.memesh đọc được và đĩa còn chỗ trống.","doctor.msg.hook-activity.stale-unknown.summary":'Không đọc được thời điểm chạy gần nhất của hook {hook} (dữ liệu hỏng, hoặc do một máy lệch đồng hồ ghi). Tình trạng thu thập hiện là "không rõ", và điều đó không giống "khỏe mạnh".',"doctor.msg.hook-activity.stale-unknown.fix":"Kết thúc một phiên làm việc rồi chạy lại `memesh doctor` — lần chạy mới sẽ ghi đè dấu thời gian hỏng.","doctor.msg.hook-activity.disabled.summary":"Thu thập tự động đang tắt (MEMESH_AUTO_CAPTURE hoặc autoCapture trong cấu hình) — do chủ ý, nên hook im lặng là điều dự kiến. Bật lại để tiếp tục thu thập phiên.","doctor.msg.hook-activity.disabled-env.summary":"Thu thập tự động bị tắt bởi MEMESH_AUTO_CAPTURE=false trong môi trường shell này. doctor chỉ thấy được môi trường của chính nó — nếu agent của bạn chạy không có biến này, thu thập ở đó không bị ảnh hưởng.","doctor.msg.hook-activity.not-wired.summary":"Chưa có hook thu thập nào từng chạy — và trên máy này không xác nhận được hook thu thập nào (Stop / PostToolUse / PreCompact) đã đấu nối, nên không có gì để chạy.","doctor.msg.hook-activity.not-wired.fix":"Nếu muốn thu thập tự động, chạy `memesh install-hooks`. Nếu bản cài này chỉ dùng MCP (Codex / Gemini), đây là bình thường và có thể bỏ qua.","doctor.msg.hook-activity.stop-silent.summary":"Hook {hook} vẫn đang ghi dấu, nhưng hook session-summary chưa từng chạy lần nào trong {hours} giờ kể từ khi bắt đầu theo dõi — thu thập phiên có thể đã hỏng, bị che bởi thu thập commit.","doctor.msg.hook-activity.stop-silent.fix":"Kết thúc một phiên làm việc rồi chạy lại `memesh doctor`. Nếu session-summary vẫn chưa chạy, chạy `memesh install-hooks` và khởi động lại agent.","doctor.label.capture-liveness":"Ghi nhớ còn sống","doctor.msg.capture-liveness.silent-hook.summary":"{hook}: chạy {runs} lần, ghi 0 lần — lý do «{reason}». Hook vẫn sống nhưng lần nào cũng kết luận không có gì để lưu; một đường bắt giữ bị hỏng cũng trông y hệt.","doctor.msg.capture-liveness.silent-hook.fix":"Chạy `memesh doctor --json` để xem số liệu từng hook. Nếu lý do đó không đúng với cách bạn làm việc, chạy `memesh install-hooks` rồi khởi động lại agent.","doctor.msg.capture-liveness.type-stopped.summary":"Trong 7 ngày qua không có gì thuộc loại «{type}» được lưu, so với {prev} trong 7 ngày trước đó. Thứ từng được ghi nhớ nay không còn được ghi nhớ nữa.","doctor.msg.capture-liveness.type-stopped.fix":"Chạy `memesh doctor --json` để xem số liệu từng hook, và kiểm tra xem cách bạn làm việc có thay đổi không — nếu không, chạy `memesh install-hooks` rồi khởi động lại agent.","doctor.msg.capture-liveness.never-ran.summary":"Trong {hours} giờ kể từ khi bắt đầu theo dõi, hook {hook} không để lại bản ghi lẫn nhịp tim — nó chưa từng chạy, nên không có gì nó đáng lẽ bắt được được lưu lại.","doctor.msg.capture-liveness.never-ran.fix":"Chạy `memesh install-hooks` và khởi động lại agent, sau đó kết thúc một phiên làm việc rồi chạy lại `memesh doctor`.","doctor.msg.capture-liveness.not-wired.summary":"Hook {hook} chưa từng chạy, nhưng máy này chưa kết nối hook ghi nhớ nào.","doctor.msg.capture-liveness.not-wired.fix":"Nếu muốn ghi nhớ tự động, hãy chạy `memesh install-hooks`. Nếu đây chỉ là MCP (Codex, Gemini hoặc Cursor), điều này là bình thường.","doctor.msg.capture-liveness.never-ran-legacy.summary":"Hook {hook} không có bản ghi kết quả, nhưng đã có {captured} ký ức được ghi tự động từ khi bắt đầu theo dõi. Có thể hook phiên bản cũ vẫn đang chạy.","doctor.msg.capture-liveness.never-ran-legacy.fix":"Hãy cập nhật các hook MeMesh, khởi động lại agent rồi chạy lại `memesh doctor`.","doctor.msg.capture-liveness.query-failed.summary":"Không đọc được trạng thái ghi nhớ từ cơ sở dữ liệu: {detail}. Không biết có gì được lưu hay không, và không biết thì không giống với khỏe mạnh.","doctor.msg.capture-liveness.query-failed.fix":"Lỗi được trích ở trên. Hãy kiểm tra ~/.memesh có đọc được không và đĩa còn trống không.","doctor.msg.hook-activity.never-ran-legacy.summary":"Chưa hook nào ghi dấu nhịp tim, nhưng từ khi bắt đầu theo dõi đã có {captured} ký ức thu thập tự động — nhiều khả năng hook từ phiên bản trước khi có theo dõi nhịp tim vẫn đang chạy.","doctor.msg.hook-activity.never-ran-legacy.fix":"Cập nhật hook memesh lên phiên bản hiện tại (plugin: `/plugin update memesh`; npm: `memesh install-hooks`), rồi khởi động lại agent.","doctor.msg.node-runtime.too-old.summary":"Node.js của bạn cũ hơn mức gói này hỗ trợ. {detail}","doctor.msg.node-runtime.too-old.fix":"Nâng cấp Node.js lên {required} trở lên, rồi chạy lại `memesh doctor`.","doctor.msg.native-binding.load-failed.summary":"SQLite không thể mở cơ sở dữ liệu: {detail}.","doctor.msg.native-binding.load-failed.fix":"Kiểm tra môi trường Node y":"memesh aún no está conectado con Claude Code, así que nada se recuerda automáticamente.","doctor.msg.hook-wiring.no-marker.fix":"Ejecuta `memesh install-hooks` una vez, y luego `memesh doctor` para confirmar.","doctor.msg.hook-wiring.script-missing.summary":"Un hook memesh conectado apunta a {path}, que ya no existe — el agente invoca un archivo inexistente en cada evento correspondiente. Suele ser residuo de una actualización que retiró el hook.","doctor.msg.hook-wiring.script-missing.fix":"Ejecuta `memesh install-hooks` para reconectar (elimina entradas retiradas) y reinicia el agente.","doctor.msg.hook-wiring.marker-unreadable.summary":"El registro de conexión en {path} no se puede leer.","doctor.msg.hook-wiring.marker-unreadable.fix":"Ejecuta `memesh install-hooks` otra vez.","doctor.msg.hook-wiring.marker-malformed.summary":"El registro de conexión está dañado.","doctor.msg.hook-wiring.marker-malformed.fix":"Ejecuta `memesh install-hooks` otra vez.","doctor.msg.hook-wiring.settings-missing.summary":"El archivo de ajustes de Claude Code ({path}) desapareció, así que la conexión está rota.","doctor.msg.hook-wiring.settings-missing.fix":"Ejecuta `memesh install-hooks` otra vez.","doctor.msg.hook-wiring.settings-invalid.summary":"{path} está dañado (no es JSON válido).","doctor.msg.hook-wiring.settings-invalid.fix":"Restáuralo desde una copia de seguridad, o ejecuta `memesh install-hooks` para recrearlo.","doctor.msg.hook-wiring.entries-removed.summary":"Las entradas de memesh fueron eliminadas de {path}, así que la conexión está rota.","doctor.msg.hook-wiring.entries-removed.fix":"Ejecuta `memesh install-hooks` otra vez.","doctor.msg.hook-wiring.root-moved.summary":"La conexión apunta a {path}, que ya no existe (probablemente memesh se movió).","doctor.msg.hook-wiring.root-moved.fix":"Ejecuta `memesh install-hooks` para actualizarla.","doctor.msg.hook-activity.never-ran.summary":"Ningún hook de captura se ha ejecutado en las {hours} horas desde que empezó el seguimiento, aun con el cableado de hooks en su sitio — no se está guardando nada.","doctor.msg.hook-activity.never-ran.fix":"Termina una sesión de trabajo y vuelve a ejecutar `memesh doctor`. Si sigue diciendo que ningún hook se ejecutó, ejecuta `memesh install-hooks` y reinicia el agente.","doctor.msg.hook-activity.stale.summary":"El último hook de captura se ejecutó hace unas {hours} horas ({hook}). Si has trabajado desde entonces, la captura se detuvo y nada de esas sesiones se guardó.","doctor.msg.hook-activity.stale.fix":"Reinicia el agente, termina una sesión y vuelve a ejecutar `memesh doctor`. Si no se recupera, ejecuta `memesh install-hooks`.","doctor.msg.hook-activity.stale-unconfirmed.summary":"El hook session-summary se ejecutó por última vez hace unas {hours} horas, y tampoco llegó ninguna escritura de Claude Code en los últimos 3 días. Si esta máquina pasó a otro agente (Codex / Gemini), es lo esperado; si todavía usas Claude Code aquí, la captura se detuvo.","doctor.msg.hook-activity.stale-unconfirmed.fix":"Si todavía usas Claude Code en esta máquina: reinícialo, termina una sesión y vuelve a ejecutar `memesh doctor`. Si no se recupera, ejecuta `memesh install-hooks`.","doctor.msg.hook-activity.query-failed.summary":"No se pudo leer la actividad de los hooks en la base de datos: {detail}. El estado de la captura es desconocido, que no es lo mismo que sano.","doctor.msg.hook-activity.query-failed.fix":"Ejecuta `memesh doctor --verbose` para ver el error completo y comprueba que ~/.memesh se puede leer y que hay espacio en disco.","doctor.msg.hook-activity.stale-unknown.summary":"La marca de tiempo de la última ejecución del hook {hook} no se puede leer (corrupta, o escrita por una máquina con el reloj mal). El estado de la captura es «desconocido», que no es lo mismo que «sano».","doctor.msg.hook-activity.stale-unknown.fix":"Termina una sesión de trabajo y vuelve a ejecutar `memesh doctor` — una ejecución nueva sobrescribe la marca de tiempo dañada."," } en los 7 días anteriores. Algo que se recordaba ha dejado de recordarse.","doctor.msg.capture-liveness.type-stopped.fix":"Ejecuta `memesh doctor --json` para ver las cifras por hook y comprueba si tu forma de trabajar cambió; si no cambió, ejecuta `memesh install-hooks` y reinicia el agente.","doctor.msg.capture-liveness.never-ran.summary":"El hook {hook} no ha dejado registro ni latido en las {hours} horas desde que empezó el seguimiento: nunca se ejecutó, así que nada de lo que capturaría se está guardando.","doctor.msg.capture-liveness.never-ran.fix":"Ejecuta `memesh install-hooks` y reinicia el agente, luego termina una sesión de trabajo y vuelve a ejecutar `memesh doctor`.","doctor.msg.capture-liveness.not-wired.summary":"El hook {hook} nunca se ha ejecutado, pero esta máquina no tiene conectado ningún hook de captura.","doctor.msg.capture-liveness.not-wired.fix":"Si quieres captura automática, ejecuta `memesh install-hooks`. Si esta instalación solo usa MCP (Codex, Gemini o Cursor), es normal.","doctor.msg.capture-liveness.never-ran-legacy.summary":"El hook {hook} no tiene registro de resultados, pero se guardaron {captured} memorias de captura automática desde que comenzó el seguimiento. Probablemente siguen activos hooks antiguos.","doctor.msg.capture-liveness.never-ran-legacy.fix":"Actualiza los hooks de MeMesh, reinicia el agente y vuelve a ejecutar `memesh doctor`.","doctor.msg.capture-liveness.query-failed.summary":"No se pudo leer el estado de la captura desde la base de datos: {detail}. Se desconoce si se está guardando algo, y desconocido no es lo mismo que sano.","doctor.msg.capture-liveness.query-failed.fix":"El error está citado arriba. Comprueba que ~/.memesh se pueda leer y que el disco no esté lleno.","doctor.msg.hook-activity.never-ran-legacy.summary":"Ningún hook ha sellado el latido, pero {captured} memorias de captura automática llegaron desde que empezó el seguimiento — probablemente siguen ejecutándose hooks de una versión anterior al se
